# Compose configuration for phases/00-setup-and-tooling/07-docker-for-ai/docs/en.md.
# Requests GPU capability and keeps model data in a named volume.
# No UI, database, or long-running service is implied by this fixture.
# Run `docker compose config` to validate syntax before any build or runtime check.

services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../../../:/workspace
      - model_cache:/models
      - ~/datasets:/data
    stdin_open: true
    tty: true
    command: ["python3", "-c", "print('AI dev container ready')"]

volumes:
  model_cache:
