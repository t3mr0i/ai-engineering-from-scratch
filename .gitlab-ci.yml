# GitLab CI: build the site and deploy it to Azure Static Web Apps.
#
# Web root is site/. Lesson content (phases/<phase>/<lesson>/docs/en.md and
# quiz.json) is staged into site/phases/ so lesson.html loads it at runtime
# with no GitHub/GitLab fetch.
#
# Required CI/CD variable (Settings > CI/CD > Variables), masked & protected:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  — deployment token of the Azure SWA resource
#                                      (az staticwebapp secrets list ... apiKey)

stages:
  - deploy

deploy_azure:
  stage: deploy
  image: node:20-bullseye
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - node site/build.js
    - mkdir -p site/phases
    - >
      rsync -a --prune-empty-dirs
      --include='*/'
      --include='docs/en.md'
      --include='quiz.json'
      --include='code/main.py'
      --exclude='*'
      phases/ site/phases/
    - npx --yes @azure/static-web-apps-cli@latest deploy ./site
      --deployment-token "$AZURE_STATIC_WEB_APPS_API_TOKEN"
      --env production
      --no-use-keychain
  environment:
    name: production
    url: https://yellow-mushroom-0c0a45d03.7.azurestaticapps.net
