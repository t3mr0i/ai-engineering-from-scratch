# Zero-to-JupyterHub Helm values for the lesson environment.
# Sized for ~300 light notebook users (API/RAG glue, no heavy training).
#
# Auth note: starts open (dummy auth) so the first deploy is testable. Harden
# with Entra/OAuth before real use — see the README.

# Contributor can't attach-acr (needs a role assignment), so pull via the
# acr-pull docker-registry secret created in the jhub namespace. Top-level key
# applies it to all chart pods (hub + singleuser).
imagePullSecrets:
  - name: acr-pull

singleuser:
  image:
    name: aseidecr338558e0.azurecr.io/lesson-notebook   # set to your ACR image at install
    tag: latest
    pullPolicy: Always
  # Seed each user's home with the baked-in lessons on first start.
  lifecycleHooks:
    postStart:
      exec:
        command:
          - "sh"
          - "-c"
          - "test -d $HOME/lessons || cp -r /opt/lessons $HOME/lessons"
  # Per-user resource caps. 0.5 vCPU guarantee, burst to 1; 1 GiB guarantee, 2 cap.
  cpu:
    guarantee: 0.3
    limit: 1.0
  memory:
    guarantee: 1G
    limit: 2G
  storage:
    type: dynamic
    capacity: 1Gi
  # Reclaim idle servers so 300 users don't pin 300 pods forever.
  defaultUrl: "/lab"

# Cull idle single-user servers (frees nodes; key to controlling cost at 300).
cull:
  enabled: true
  timeout: 1800        # 30 min idle -> shut down the user's server
  every: 300
  maxAge: 14400        # hard cap 4h per server

hub:
  config:
    JupyterHub:
      authenticator_class: dummy   # OPEN — replace with Entra/OAuth before prod
    Authenticator:
      admin_users: []

proxy:
  service:
    type: LoadBalancer   # public IP for browser access

# Let the cluster autoscaler add nodes as users spawn.
scheduling:
  userScheduler:
    enabled: true
  podPriority:
    enabled: true
  userPlaceholder:
    enabled: true
    replicas: 2          # keep 2 warm slots for fast spawns
