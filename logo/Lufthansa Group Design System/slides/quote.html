<!-- @dsCard group="Slides" viewport="1280x720" name="Quote slide" subtitle="Editorial serif pull-quote on warm grey" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;height:100%}
  .slide{width:1280px;height:720px;background:var(--lhg-grey-200);position:relative;overflow:hidden;font-family:var(--font-body);box-sizing:border-box;padding:110px 120px;display:flex;flex-direction:column;justify-content:center}
  .crane{height:42px;margin-bottom:44px}
  blockquote{font-family:var(--font-serif);font-weight:400;font-size:52px;line-height:1.28;letter-spacing:-.01em;color:var(--lhg-core-blue);margin:0;max-width:980px}
  .by{margin-top:40px;display:flex;align-items:center;gap:16px}
  .by .ln{width:48px;height:1px;background:var(--lhg-blue-500)}
  .by span{font-weight:500;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body>
  <div class="slide">
    <img class="crane" src="../assets/logos/lh-crane.svg" alt="">
    <blockquote>“We are connecting people, cultures and economies in a sustainable way.”</blockquote>
    <div class="by"><span class="ln"></span><span>Carsten Spohr · Chairman &amp; CEO</span></div>
  </div>
</body></html>
