<!-- @dsCard group="Slides" viewport="1280x720" name="Section divider" subtitle="Light section break with oversized number" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;height:100%}
  .slide{width:1280px;height:720px;background:var(--lhg-grey-100);position:relative;overflow:hidden;font-family:var(--font-body)}
  .inner{position:absolute;inset:0;padding:96px;display:flex;flex-direction:column;justify-content:center}
  .num{font-family:var(--font-display);font-weight:200;font-size:200px;line-height:.9;letter-spacing:-.04em;color:var(--lhg-grey-300)}
  .eyebrow{font-weight:500;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--lhg-blue-500);margin:24px 0 14px}
  h2{font-family:var(--font-display);font-weight:200;font-size:64px;line-height:1.04;letter-spacing:-.02em;color:var(--lhg-core-blue);margin:0;max-width:820px}
  .bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--lhg-blue-500)}
  .logo{position:absolute;bottom:56px;left:96px;height:22px}
</style></head><body>
  <div class="slide">
    <div class="bar"></div>
    <div class="inner">
      <div class="num">02</div>
      <div class="eyebrow">Responsibility</div>
      <h2>Our path to net&nbsp;zero by&nbsp;2050.</h2>
    </div>
    <img class="logo" src="../assets/logos/lhg-lockup.svg" alt="Lufthansa Group">
  </div>
</body></html>
