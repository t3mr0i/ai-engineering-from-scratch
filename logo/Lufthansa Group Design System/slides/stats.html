<!-- @dsCard group="Slides" viewport="1280x720" name="Stat slide" subtitle="Big thin figures — the report KPI layout" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;height:100%}
  .slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;font-family:var(--font-body);box-sizing:border-box;padding:88px 96px;display:flex;flex-direction:column}
  .eyebrow{font-weight:500;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--lhg-blue-500)}
  h2{font-family:var(--font-display);font-weight:200;font-size:48px;letter-spacing:-.02em;color:var(--lhg-core-blue);margin:14px 0 0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:auto;margin-bottom:auto}
  .kpi .v{font-family:var(--font-display);font-weight:200;font-size:96px;line-height:.95;letter-spacing:-.03em;color:var(--lhg-core-blue)}
  .kpi .v small{font-size:34px;color:var(--lhg-blue-500)}
  .kpi .l{font-weight:300;font-size:18px;color:var(--text-secondary);margin-top:14px;max-width:280px}
  .kpi{border-top:2px solid var(--lhg-core-blue);padding-top:22px}
  .logo{position:absolute;bottom:56px;right:96px;height:22px}
</style></head><body>
  <div class="slide">
    <div class="eyebrow">Financial year 2024</div>
    <h2>A year of sustainable growth.</h2>
    <div class="grid">
      <div class="kpi"><div class="v">1.673<small> Mio €</small></div><div class="l">Adjusted EBIT, up 12% year on year</div></div>
      <div class="kpi"><div class="v">250<small>+</small></div><div class="l">Destinations across five airlines</div></div>
      <div class="kpi"><div class="v">30<small>%</small></div><div class="l">Less CO₂ on next-generation aircraft</div></div>
    </div>
    <img class="logo" src="../assets/logos/lhg-lockup.svg" alt="Lufthansa Group">
  </div>
</body></html>
