<!-- @dsCard group="Components" viewport="700x520" name="Forms" subtitle="Input, Select, Search, Textarea, Radio, Checkbox & Switch" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--lhg-grey-100);font-family:var(--font-body);padding:26px 30px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Switch, RadioGroup, Textarea, SearchBar } = window.LufthansaGroupDesignSystem_70bbed;
function Demo(){
  const [v,setV]=React.useState('');
  const [cab,setCab]=React.useState('Business');
  const [ok,setOk]=React.useState(true);
  const [on,setOn]=React.useState(true);
  const [seat,setSeat]=React.useState('Window');
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,maxWidth:640}}>
    <Input label="Email" type="email" icon="ph-envelope" placeholder="you@example.com" value={v} onChange={e=>setV(e.target.value)} />
    <Select label="Cabin class" value={cab} onChange={e=>setCab(e.target.value)} options={["Economy","Premium Economy","Business","First"]} />
    <div style={{gridColumn:'1 / -1'}}><SearchBar placeholder="Search flights, routes, destinations" width={600} /></div>
    <Textarea label="Special requests" rows={3} placeholder="Let us know how we can help" />
    <div style={{display:'flex',flexDirection:'column',gap:16,justifyContent:'flex-start'}}>
      <RadioGroup name="seat" value={seat} onChange={setSeat} options={["Window","Aisle","No preference"]} />
      <Checkbox label="I accept the fare conditions" checked={ok} onChange={e=>setOk(e.target.checked)} />
      <Switch label="Receive fare alerts" checked={on} onChange={setOn} />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
