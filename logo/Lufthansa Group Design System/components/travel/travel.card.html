<!-- @dsCard group="Components" viewport="700x420" name="Travel — Flight & Fare cards" subtitle="Flight result rows and fare option cards" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--lhg-grey-100);font-family:var(--font-body);padding:24px 30px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { FlightCard, FareCard, Stepper } = window.LufthansaGroupDesignSystem_70bbed;
function Demo(){
  const [sel,setSel]=React.useState('lh400');
  const [fare,setFare]=React.useState('flex');
  return (<div style={{display:'flex',flexDirection:'column',gap:22}}>
    <Stepper steps={["Search","Select","Passengers","Payment"]} current={1}/>
    <FlightCard depTime="10:25" arrTime="13:05" from="FRA" to="JFK" duration="8h 40m" stops="Direct" flightNo="LH 400" price="612" selected={sel==='lh400'} onSelect={()=>setSel('lh400')}/>
    <div style={{display:'flex',gap:16}}>
      <FareCard name="Economy Light" price="612" perks={[{label:'Carry-on bag',included:true},{label:'Checked bag',included:false},{label:'Rebooking',included:false}]} selected={fare==='light'} onSelect={()=>setFare('light')}/>
      <FareCard name="Economy Flex" price="742" featured perks={[{label:'Carry-on bag',included:true},{label:'Checked bag',included:true},{label:'Free rebooking',included:true}]} selected={fare==='flex'} onSelect={()=>setFare('flex')}/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
