<!-- @dsCard group="Booking flow" viewport="1280x820" name="Flight booking" subtitle="Search → results → checkout, an interactive multi-step booking flow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a flight — Lufthansa Group</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--lhg-grey-100)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="BookingHeader.jsx"></script>
<script type="text/babel" src="SearchScreen.jsx"></script>
<script type="text/babel" src="ResultsScreen.jsx"></script>
<script type="text/babel" src="CheckoutScreen.jsx"></script>
<script type="text/babel" src="ConfirmDialog.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [step,setStep]=React.useState(0);
  const [done,setDone]=React.useState(false);
  return (<React.Fragment>
    <BookingHeader step={step}/>
    {step===0 && <SearchScreen onSearch={()=>setStep(1)}/>}
    {step===1 && <ResultsScreen onSelect={()=>setStep(2)} onBack={()=>setStep(0)}/>}
    {step===2 && <CheckoutScreen onConfirm={()=>{setStep(3);setDone(true);}} onBack={()=>setStep(1)}/>}
    {step===3 && <CheckoutScreen onConfirm={()=>setDone(true)} onBack={()=>setStep(1)}/>}
    <ConfirmDialog open={done} onClose={()=>{setDone(false);setStep(0);}}/>
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
