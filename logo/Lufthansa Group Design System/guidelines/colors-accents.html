<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-surface)}
  .row{display:flex;gap:0}
  .sw{flex:1;height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-sizing:border-box;color:#fff}
  .sw b{font-weight:var(--weight-medium);font-size:14px;display:block}
  .sw span{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--lhg-red)"><b>LHG Red</b><span>#BC0A1D</span></div>
  <div class="sw" style="background:var(--lhg-teal)"><b>LHG Teal</b><span>#368089</span></div>
  <div class="sw" style="background:var(--lhg-purple)"><b>LHG Purple</b><span>#A82E61</span></div>
  <div class="sw" style="background:var(--lhg-sand)"><b>LHG Sand</b><span>#857461</span></div>
</div>
</body></html>
