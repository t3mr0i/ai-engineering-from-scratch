<!-- @dsCard group="Colors" viewport="700x150" name="Brand core" subtitle="Core Blue anchors everything; Blue 500 carries interaction" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-surface)}
  .row{display:flex;gap:0}
  .sw{flex:1;height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-sizing:border-box}
  .sw b{font-weight:var(--weight-medium);font-size:14px;display:block}
  .sw span{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
  .on-dark{color:#fff}.on-dark span{opacity:.85}
  .on-light{color:var(--lhg-core-blue)}
  .bordered{box-shadow:inset 0 0 0 1px var(--border-subtle)}
</style></head><body>
<div class="row">
  <div class="sw on-dark" style="background:var(--lhg-core-blue)"><b>Core Blue</b><span>#05164D</span></div>
  <div class="sw on-dark" style="background:var(--lhg-blue-500)"><b>Blue 500</b><span>#2D5FE4</span></div>
  <div class="sw on-dark" style="background:var(--lhg-blue-600)"><b>Blue 600</b><span>#243F9B</span></div>
  <div class="sw on-light" style="background:var(--lhg-blue-100)"><b>Blue 100</b><span>#E5F1FF</span></div>
  <div class="sw on-light bordered" style="background:#fff"><b>White</b><span>#FFFFFF</span></div>
</div>
</body></html>
