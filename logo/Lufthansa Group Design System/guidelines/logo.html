<!-- @dsCard group="Brand" viewport="700x180" name="Logo & lockup" subtitle="The crane mark and LUFTHANSA GROUP wordmark — Core Blue & reversed" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-surface);display:flex}
  .panel{flex:1;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .light{background:#fff}
  .dark{background:var(--lhg-core-blue)}
  .crane{height:30px}
  .lock{height:20px}
  .rev{filter:brightness(0) invert(1)}
  .cap{position:absolute;bottom:8px;font-size:10px;color:var(--text-muted);letter-spacing:.06em}
</style></head><body>
  <div class="panel light">
    <img class="crane" src="../assets/logos/lh-crane.svg" alt="Lufthansa crane">
    <img class="lock" src="../assets/logos/lhg-lockup.svg" alt="Lufthansa Group">
  </div>
  <div class="panel dark">
    <img class="crane rev" src="../assets/logos/lh-crane.svg" alt="Lufthansa crane reversed">
    <img class="lock rev" src="../assets/logos/lhg-lockup.svg" alt="Lufthansa Group reversed">
  </div>
</body></html>
