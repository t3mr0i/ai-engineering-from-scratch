<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-surface);padding:24px 32px;color:var(--lhg-core-blue);max-width:640px}
  .lead{font-size:21px;font-weight:300;line-height:1.6;margin:0 0 14px}
  .body{font-size:17px;font-weight:300;line-height:1.5;color:var(--text-secondary);margin:0 0 16px}
  .quote{font-family:var(--font-serif);font-size:22px;font-weight:400;line-height:1.4;color:var(--lhg-core-blue);border-left:2px solid var(--lhg-blue-500);padding-left:16px;margin:0}
</style></head><body>
  <p class="lead">We are connecting people, cultures and economies in a sustainable way.</p>
  <p class="body">Lufthansa Group currently has more than 250 new aircraft on order, reducing fuel consumption and CO₂ emissions by up to 30 percent compared to their predecessors.</p>
  <p class="quote">Discover the world, one detail at a time.</p>
</body></html>
