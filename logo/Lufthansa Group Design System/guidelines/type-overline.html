<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-surface);padding:28px 32px;display:flex;flex-direction:column;gap:14px}
  .ov{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--lhg-blue-500)}
  .ov.muted{color:var(--text-muted)}
  .num{font-family:var(--font-display);font-weight:200;font-size:40px;color:var(--lhg-core-blue);line-height:1}
</style></head><body>
  <span class="ov">Sustainability</span>
  <span class="ov muted">Annual report · 2024</span>
  <span class="num">1.673 <span style="font-size:14px;color:var(--text-muted)">Mio €</span></span>
</body></html>
