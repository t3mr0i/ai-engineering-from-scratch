<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Functional colours for feedback states" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-surface);padding:20px;display:flex;gap:14px}
  .chip{flex:1;border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-primary)}
  .dot{width:18px;height:18px;border-radius:50%}
</style></head><body>
  <div class="chip"><span class="dot" style="background:var(--lhg-success)"></span>Success</div>
  <div class="chip"><span class="dot" style="background:var(--lhg-warning)"></span>Warning</div>
  <div class="chip"><span class="dot" style="background:var(--lhg-error)"></span>Error</div>
  <div class="chip"><span class="dot" style="background:var(--lhg-info)"></span>Info</div>
</body></html>
