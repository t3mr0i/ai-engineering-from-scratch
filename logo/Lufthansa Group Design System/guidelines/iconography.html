<!-- @dsCard group="Brand" viewport="700x220" name="Iconography" subtitle="Thin single-weight line icons (Phosphor Light substitute) — flag: not official set" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-surface);padding:24px 32px}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .ic{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--lhg-core-blue);font-size:30px}
  .note{margin-top:14px;font-size:11px;color:var(--text-muted)}
</style></head><body>
  <div class="grid">
    <div class="ic"><i class="ph-light ph-airplane-tilt"></i></div>
    <div class="ic"><i class="ph-light ph-suitcase-rolling"></i></div>
    <div class="ic"><i class="ph-light ph-ticket"></i></div>
    <div class="ic"><i class="ph-light ph-users-three"></i></div>
    <div class="ic"><i class="ph-light ph-check-square-offset"></i></div>
    <div class="ic"><i class="ph-light ph-laptop"></i></div>
    <div class="ic"><i class="ph-light ph-globe-hemisphere-west"></i></div>
    <div class="ic"><i class="ph-light ph-leaf"></i></div>
    <div class="ic"><i class="ph-light ph-seat"></i></div>
    <div class="ic"><i class="ph-light ph-map-pin"></i></div>
    <div class="ic"><i class="ph-light ph-clock"></i></div>
    <div class="ic"><i class="ph-light ph-shield-check"></i></div>
    <div class="ic"><i class="ph-light ph-wifi-high"></i></div>
    <div class="ic"><i class="ph-light ph-coffee"></i></div>
    <div class="ic"><i class="ph-light ph-calendar-blank"></i></div>
    <div class="ic"><i class="ph-light ph-magnifying-glass"></i></div>
  </div>
  <p class="note">Phosphor Icons · Light weight — substitute for the official LHG line-icon set (SVGs not provided).</p>
</body></html>
