<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Soft corners; buttons are full pill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-surface);padding:24px 32px;display:flex;gap:18px;align-items:center}
  .b{width:84px;height:84px;background:var(--lhg-blue-100);border:1px solid var(--lhg-blue-500);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-sizing:border-box;font-size:11px;color:var(--lhg-core-blue)}
  .pill{width:120px;border-radius:var(--radius-pill)}
</style></head><body>
  <div class="b" style="border-radius:var(--radius-xs)">4 xs</div>
  <div class="b" style="border-radius:var(--radius-sm)">8 sm</div>
  <div class="b" style="border-radius:var(--radius-md)">12 md</div>
  <div class="b" style="border-radius:var(--radius-lg)">20 lg</div>
  <div class="b pill">pill</div>
</body></html>
