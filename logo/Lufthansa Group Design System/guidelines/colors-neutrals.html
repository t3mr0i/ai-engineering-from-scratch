<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Warm grey family — page, surfaces, hairlines, muted text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-surface)}
  .row{display:flex;gap:0}
  .sw{flex:1;height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-sizing:border-box;color:var(--lhg-core-blue)}
  .sw b{font-weight:var(--weight-medium);font-size:13px;display:block}
  .sw span{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
  .bordered{box-shadow:inset 0 0 0 1px var(--border-subtle)}
  .dk{color:#fff}.dk span{opacity:.85}
</style></head><body>
<div class="row">
  <div class="sw dk" style="background:var(--lhg-slate-700)"><b>Slate 700</b><span>#52617C</span></div>
  <div class="sw dk" style="background:var(--lhg-slate-500)"><b>Slate 500</b><span>#657898</span></div>
  <div class="sw dk" style="background:var(--lhg-warm-grey)"><b>Warm Grey</b><span>#7A7673</span></div>
  <div class="sw bordered" style="background:var(--lhg-grey-300)"><b>Grey 300</b><span>#E3E1DE</span></div>
  <div class="sw bordered" style="background:var(--lhg-grey-200)"><b>Grey 200</b><span>#F1F0EF</span></div>
  <div class="sw bordered" style="background:var(--lhg-grey-100)"><b>Grey 100</b><span>#F9F8F8</span></div>
</div>
</body></html>
