<!-- @dsCard group="Brand" viewport="700x220" name="Horizon field" subtitle="Deep-blue brand field with faint arc — the hero background motif" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body)}
  .field{height:220px;background:var(--lhg-core-blue);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 40px;color:#fff}
  .field::after{content:"";position:absolute;right:-20%;top:-40%;width:75%;height:180%;border-radius:50%;z-index:0;
    background:radial-gradient(circle at 65% 50%, rgba(63,115,216,.5), rgba(5,22,77,0) 62%)}
  .arc{position:absolute;left:-5%;bottom:-60%;width:110%;height:120%;border-top:1px solid rgba(255,255,255,.35);border-radius:50%}
  h2{font-family:var(--font-display);font-weight:200;letter-spacing:-.02em;font-size:40px;margin:0;position:relative;z-index:2;line-height:1.05;color:#fff}
</style></head><body>
  <div class="field">
    <div class="arc"></div>
    <h2>Taking travel<br>to new heights.</h2>
  </div>
</body></html>
