apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ase-site-gated
  namespace: trainingcamp-prod
spec:
  host: trainingcamp.lhind.ai
  to:
    kind: Service
    name: ase-site-gated
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    # certificate / key / caCertificate must be supplied for trainingcamp.lhind.ai
    # (the OCP wildcard cert only covers *.apps.ocp03.cloud.lhind.app.lufthansa.com)
    # — fill in from the cert issued for this domain, or switch termination to
    # "reencrypt"/"passthrough" if TLS is terminated upstream instead.
