apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ase-site-gated
  namespace: trainingcamp-prod
spec:
  # No custom host: trainingcamp.lhind.ai isn't a resolvable internal DNS
  # zone (confirmed NXDOMAIN), so we use the cluster-generated hostname under
  # the default *.apps.ocp03.cloud.lhind.app.lufthansa.com wildcard domain —
  # no new DNS record, no new cert. The reverse proxy in front of this route
  # must rewrite the Host header to the generated hostname (see
  # `oc get route ase-site-gated -o jsonpath='{.spec.host}'`), since this is
  # the generic-domain case, not a route with its own custom host.
  to:
    kind: Service
    name: ase-site-gated
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
