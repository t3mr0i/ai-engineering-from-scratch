# Template only — do NOT commit real values. Create the actual secret with:
#
#   oc create secret generic ase-site-gated-secrets \
#     -n trainingcamp-prod \
#     --from-literal=SITE_PASSCODE='<passcode, unused while GATE_DISABLED=true>' \
#     --from-literal=GATE_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=LLM_GATEWAY_KEY='<Bifrost gateway key from the LLM gateway team>'
#
# SITE_PASSCODE/GATE_SECRET are wired up but currently unused — see
# GATE_DISABLED in deployment.yaml. LLM_GATEWAY_KEY is live: it's the key
# server/server.js injects into POST /api/llm/chat/completions so it never
# reaches the browser. Rotating either GATE_SECRET or LLM_GATEWAY_KEY requires
# updating this secret + a rollout restart; the gateway key rotation also
# needs coordination with whoever issued it (rate/budget limits are tied to it).
apiVersion: v1
kind: Secret
metadata:
  name: ase-site-gated-secrets
  namespace: trainingcamp-prod
type: Opaque
stringData:
  SITE_PASSCODE: CHANGEME
  GATE_SECRET: CHANGEME
  LLM_GATEWAY_KEY: CHANGEME
