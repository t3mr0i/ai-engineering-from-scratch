# Template only — do NOT commit real values. Create the actual secret with:
#
#   oc create secret generic ase-site-gated-secrets \
#     -n trainingcamp-prod \
#     --from-literal=SITE_PASSCODE='<the shared passcode>' \
#     --from-literal=GATE_SECRET='<random hex, e.g. openssl rand -hex 32>'
#
# Reusing the existing Azure App Service values for SITE_PASSCODE/GATE_SECRET
# keeps cookies signed under the old deployment valid against the new one.
# Rotating GATE_SECRET invalidates every outstanding ase_gate cookie.
apiVersion: v1
kind: Secret
metadata:
  name: ase-site-gated-secrets
  namespace: trainingcamp-prod
type: Opaque
stringData:
  SITE_PASSCODE: CHANGEME
  GATE_SECRET: CHANGEME
