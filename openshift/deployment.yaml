apiVersion: apps/v1
kind: Deployment
metadata:
  name: ase-site-gated
  namespace: trainingcamp-prod
  labels:
    app: ase-site-gated
spec:
  replicas: 1
  # Namespace quota (250m cpu limit total) has no headroom for the extra pod
  # RollingUpdate briefly needs alongside the old one — Recreate (stop old,
  # then start new) is the only strategy that fits.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ase-site-gated
  template:
    metadata:
      labels:
        app: ase-site-gated
    spec:
      serviceAccountName: ase-site-gated
      containers:
        - name: ase-site-gated
          image: image-registry.openshift-image-registry.svc:5000/trainingcamp-prod/ase-site-gated:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GATE_DISABLED
              value: "true"
            - name: ADMIN_DATA_DIR
              value: /var/lib/ase-admin
            - name: ADMIN_LLM_MODEL
              value: azure/gpt-5.4-mini
            - name: ADMIN_GITLAB_URL
              value: https://git02.lhind.app.lufthansa.com
            - name: ADMIN_GITLAB_PROJECT_ID
              value: lhind/pace/agentic-software-engineering/ai-training
            - name: ADMIN_GITLAB_TARGET_BRANCH
              value: main
            - name: ADMIN_IDENTITY_HEADER
              value: x-forwarded-user
            - name: ADMIN_GROUPS_HEADER
              value: x-forwarded-groups
            - name: SITE_PASSCODE
              valueFrom:
                secretKeyRef:
                  name: ase-site-gated-secrets
                  key: SITE_PASSCODE
            - name: GATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: ase-site-gated-secrets
                  key: GATE_SECRET
            - name: LLM_GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: ase-site-gated-secrets
                  key: LLM_GATEWAY_KEY
            - name: ADMIN_GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ase-site-gated-secrets
                  key: ADMIN_GITLAB_TOKEN
            - name: ADMIN_TRUSTED_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ase-site-gated-secrets
                  key: ADMIN_TRUSTED_PROXY_TOKEN
            - name: ADMIN_ROLES_JSON
              valueFrom:
                secretKeyRef:
                  name: ase-site-gated-secrets
                  key: ADMIN_ROLES_JSON
          volumeMounts:
            - name: admin-data
              mountPath: /var/lib/ase-admin
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /gate.html
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /gate.html
              port: 8080
            initialDelaySeconds: 10
      volumes:
        - name: admin-data
          persistentVolumeClaim:
            claimName: ase-admin-data
