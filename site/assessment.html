  <script>
    /* D1 — resolve an explicit stored dark-mode choice before first paint,
       same mechanism as lesson.html/llm-primer. Only an explicit stored
       value is applied; with nothing stored the attribute stays as
       authored and the prefers-color-scheme media query in lrn/tokens.css
       keeps handling the OS preference. */
    (function () {
      function apply() {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      }
      apply();
      window.addEventListener('storage', function (e) { if (e.key === 'theme') apply(); });
    })();
  </script>

    <button type="button" id="darkModeToggle" class="nav-settings theme-toggle" title="Switch color theme" aria-label="Switch color theme">
      <i class="ph-light ph-moon" aria-hidden="true" id="darkModeIcon"></i>
    </button>
    <a href="#" id="langToggle" class="nav-settings lang-toggle theme-toggle" title="Switch language" aria-label="Switch language" data-i18n-title="lang_toggle_title">

  <script>
    /* D1 — dark-mode toggle button. Wires the button in the header above
       to the same localStorage 'theme' key lesson.html/llm-primer already
       read, so the choice is shared and persisted across the whole site. */
    (function () {
      var btn = document.getElementById('darkModeToggle');
      var icon = document.getElementById('darkModeIcon');
      if (!btn) return;
      function stored() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
      function osDark() { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
      function current() {
        var s = stored();
        return (s === 'dark' || s === 'light') ? s : (osDark() ? 'dark' : 'light');
      }
      function render() {
        var theme = current();
        icon.className = 'ph-light ' + (theme === 'dark' ? 'ph-sun' : 'ph-moon');
        var de = (window.SiteLang ? window.SiteLang.get() : 'en') === 'de';
        var label = theme === 'dark'
          ? (de ? 'Zu hellem Farbschema wechseln' : 'Switch to light color theme')
          : (de ? 'Zu dunklem Farbschema wechseln' : 'Switch to dark color theme');
        btn.title = label;
        btn.setAttribute('aria-label', label);
        btn.setAttribute('aria-pressed', String(theme === 'dark'));
      }
      render();
      btn.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (e) {}
        document.documentElement.setAttribute('data-theme', next);
        render();
      });
      if (window.SiteLang) document.addEventListener('sitelang:change', render);
    })();
  </script>

      <div id="assessmentJourney" class="journey-slot" aria-live="polite"></div>

  <script>
    // The native result feeds the shared learning journey.
    (function () {
      function mountJourney() {
        var host = document.getElementById('assessmentJourney');
        if (!host || !window.LrnJourneyUI || typeof window.LrnJourneyUI.mount !== 'function') return;
        window.LrnJourneyUI.mount(host, { compact: true });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', mountJourney);
      } else {
        mountJourney();
      }
    })();
  </script>
