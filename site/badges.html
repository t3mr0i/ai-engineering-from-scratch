<!DOCTYPE html>
<html lang="de">
<head>
  <script src="/gate-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Badges · LHIND AI Learning</title>
  <meta name="description" content="Verdiene dir Badges, während du das AI Engineering Curriculum durcharbeitest — komplett lokal in deinem Browser.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305164d'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial,sans-serif' font-size='14' font-weight='700' fill='%23f8fafc'%3EAI%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/light/style.css">
  <link rel="stylesheet" href="style.css?v=20260525a">
  <link rel="stylesheet" href="badges.css?v=20260713a">
</head>
<body>
  <a class="skip-link" href="#badgesMain">Skip to badges</a>
  <header class="nav-edge" aria-label="Site navigation">
    <a class="wordmark" href="index.html">
      <img class="wordmark__logo" src="assets/logo/lhind-logo-blue.png" alt="LHIND" />
      <span>LHIND Learning Catalog</span>
    </a>
    <div class="nav-edge__spacer" aria-hidden="true" style="flex:1"></div>
    <a href="badges.html" class="nav-settings badges-link" title="Deine Badges" aria-label="Badges" aria-current="page">
      <i class="ph-light ph-medal" aria-hidden="true"></i>
      <span class="badges-link__count" id="navBadgeCount" data-show="false" aria-hidden="true">0</span>
    </a>
    <a href="#" id="themeToggle" class="nav-settings theme-toggle" title="Toggle theme" aria-label="Toggle theme">
      <span id="themeIcon" class="theme-icon">N</span>
    </a>
  </header>

  <main class="page" id="badgesMain">
    <section class="hero" aria-labelledby="badgesTitle">
      <div class="hero__inner">
        <h1 id="badgesTitle">Deine Erfolge</h1>
        <p>Sammle Badges, während du das Curriculum durcharbeitest — komplett lokal in deinem Browser.</p>
        <div data-aifs-badges-summary></div>
      </div>
    </section>

    <section class="cockpit" aria-label="Badges">
      <div data-aifs-badges-grid></div>
      <p class="badges-reset-line">
        <button type="button" id="badgesResetBtn" class="text-btn">Fortschritt &amp; Badges zurücksetzen</button>
      </p>
    </section>
  </main>

  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      var ic = document.getElementById('themeIcon');
      if (ic) ic.textContent = t === 'light' ? 'N' : 'D';
      var b = document.getElementById('themeToggle');
      if (b) b.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme');
        var nx = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', nx);
        localStorage.setItem('theme', nx);
        if (ic) ic.textContent = nx === 'light' ? 'N' : 'D';
      });
      var rb = document.getElementById('badgesResetBtn');
      if (rb) rb.addEventListener('click', function () {
        if (!confirm('Gesamten Lern-Fortschritt und alle Badges zurücksetzen? Das kann nicht rückgängig gemacht werden.')) return;
        try { localStorage.removeItem('aifs:progress:v1'); } catch (e) {}
        try { localStorage.removeItem('aifs:badges:v1'); } catch (e) {}
        if (window.AIFSProgress) { try { window.AIFSProgress.reset(); } catch (e) {} }
        location.reload();
      });
    })();
  </script>
  <script src="data.js?v=20260525a"></script>
  <script src="progress.js?v=20260525a"></script>
  <script src="badges.js?v=20260713a"></script>
</body>
</html>
