<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/gate-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>LLM Interactive Primer · LHIND AI Learning Catalog</title>
  <meta name="description" content="Interactive 60-minute primer on large language models — 16 mini-games, a real GPT tokenizer, glossary and quiz. Part of the LHIND AI Learning Catalog.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305164d'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial,sans-serif' font-size='14' font-weight='700' fill='%23f8fafc'%3EAI%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/light/style.css">
  <link rel="stylesheet" href="assets/llm-primer.css?v=1">
  <script>
    /* Match the theme the parent lesson page (and the rest of the site) is
       set to — this document runs standalone inside an <iframe>, so it
       doesn't inherit the parent's data-theme attribute automatically. */
    (function () {
      var root = document.documentElement;
      function apply() {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        if (stored) {
          root.setAttribute('data-theme', stored);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          root.setAttribute('data-theme', 'dark');
        } else {
          root.setAttribute('data-theme', 'light');
        }
      }
      apply();
      /* Keep the frame and this iframe on the same theme while the page is
         open — lesson.html runs the same listener on its side. */
      window.addEventListener('storage', function (e) { if (e.key === 'theme') apply(); });
      if (window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.addEventListener) mq.addEventListener('change', apply);
      }
    })();
  </script>
</head>
<body>
  <!-- <main> rather than <div>: this document has no other landmark, so
       screen-reader users had no way to jump past the shell into content. -->
  <main id="app" class="app"><!-- filled by assets/app.js --></main>

  <script>
  /* Static bootstrap (replaces the Vercel server-rendered shell).
     Reads the `lang` cookie (en/de, default en), fetches the matching
     content + UI JSON packs, sets the window globals app.js expects, and
     only then loads app.js (the vendored libs load lazily, on demand). Solo-only:
     APP_SYNC is always null (no journey backend on the gated static site). */
  (function () {
    "use strict";
    function cookie(n) {
      var m = document.cookie.match('(?:^|; )' + n + '=([^;]*)');
      return m ? decodeURIComponent(m[1]) : '';
    }
    var lang = cookie('lang');
    if (lang !== 'en' && lang !== 'de') lang = 'en';
    window.APP_LANG = lang;
    window.APP_URL = location.href.split('#')[0];
    window.APP_SYNC = null;

    document.documentElement.lang = lang;

    function fail() {
      var el = document.getElementById('app');
      if (el) el.innerHTML = '<div class="content center"><div class="hero-emoji"><i class="ph-light ph-warning-circle" aria-hidden="true"></i></div><h1 class="h1">Could not load the primer</h1><p class="lead">Reload the page to try again.</p></div>';
    }

    Promise.all([
      fetch('content/content.' + lang + '.json', { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
      fetch('content/ui.' + lang + '.json', { credentials: 'same-origin' }).then(function (r) { return r.json(); })
    ]).then(function (packs) {
      window.APP_DATA = packs[0];
      window.APP_I18N = packs[1];
      // Only the app loads eagerly. The ~971 KB GPT tokenizer (chapter 2) and
      // the QR lib (cover) are lazy-loaded by app.js on demand.
      function addScript(src) {
        var s = document.createElement('script');
        s.src = src; s.async = false;
        document.body.appendChild(s);
      }
      addScript('assets/app.js?v=1');
    }).catch(fail);
  })();
  </script>
</body>
</html>
