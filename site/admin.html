<!DOCTYPE html>
<html lang="de">
<head>
  <script src="/gate-guard.js"></script>
  <script>
    (function () {
      // The curriculum admin API (/api/admin/*) only exists on the OpenShift
      // Node server (server/admin-api.js) — the Azure Static Web App has no
      // Azure Function for it, so every admin call 404s here. Send admins to
      // the working deployment instead of showing a broken panel.
      if (/\.azurestaticapps\.net$/.test(location.hostname)) {
        location.replace("https://trainingcamp.lhind.app.lufthansa.com/admin.html");
        return;
      }
      try {
        var stored = localStorage.getItem("theme");
        if (stored === "dark" || stored === "light") document.documentElement.dataset.theme = stored;
      } catch (_) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f9f8f8">
  <title>Curriculum Admin · AI Learning Catalog</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305164d'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h13' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/light/style.css">
  <link rel="stylesheet" href="lrn/tokens.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <a class="admin-skip" href="#adminMain">Zum Hauptinhalt springen</a>

  <div class="admin-boot" id="adminBoot" role="status" aria-live="polite">
    <div class="admin-boot__mark" aria-hidden="true"></div>
    <p>Curriculum-Verwaltung wird geladen …</p>
  </div>

  <div class="admin-app" id="adminApp" hidden>
    <aside class="admin-sidebar" id="adminSidebar">
      <a class="admin-brand" href="index.html" aria-label="Zum Learning Catalog">
        <img src="assets/logo/lhind-logo-blue.png" alt="LHIND">
        <span>Curriculum Admin</span>
      </a>

      <nav class="admin-nav" aria-label="Admin-Navigation">
        <button class="admin-nav__item is-active" type="button" data-view="overview" aria-label="Übersicht" title="Übersicht" aria-current="page">
          <i class="ph-light ph-squares-four" aria-hidden="true"></i><span>Übersicht</span>
        </button>
        <button class="admin-nav__item" type="button" data-view="courses" aria-label="Kurse" title="Kurse">
          <i class="ph-light ph-books" aria-hidden="true"></i><span>Kurse</span>
          <span class="admin-nav__count" id="courseNavCount">0</span>
        </button>
        <button class="admin-nav__item" type="button" data-view="lessons" aria-label="Lessons" title="Lessons">
          <i class="ph-light ph-file-code" aria-hidden="true"></i><span>Lessons</span>
          <span class="admin-nav__count" id="lessonNavCount">0</span>
        </button>
        <button class="admin-nav__item" type="button" data-view="paths" aria-label="Lernpfade" title="Lernpfade">
          <i class="ph-light ph-path" aria-hidden="true"></i><span>Lernpfade</span>
          <span class="admin-nav__count" id="pathNavCount">0</span>
        </button>
        <button class="admin-nav__item" type="button" data-view="trainers" aria-label="Trainer" title="Trainer">
          <i class="ph-light ph-users-three" aria-hidden="true"></i><span>Trainer</span>
          <span class="admin-nav__count" id="trainerNavCount">0</span>
        </button>
        <button class="admin-nav__item" type="button" data-view="calendar" aria-label="Kalender" title="Kalender">
          <i class="ph-light ph-calendar-dots" aria-hidden="true"></i><span>Kalender</span>
          <span class="admin-nav__count" id="sessionNavCount">0</span>
        </button>
        <button class="admin-nav__item" type="button" data-view="teams" aria-label="Teamlernen" title="Teamlernen">
          <i class="ph-light ph-users-four" aria-hidden="true"></i><span>Teamlernen</span>
          <span class="admin-nav__count" id="teamNavCount">0</span>
        </button>
        <button class="admin-nav__item" type="button" data-view="assistant" aria-label="KI-Studio" title="KI-Studio">
          <i class="ph-light ph-sparkle" aria-hidden="true"></i><span>KI-Studio</span>
        </button>
        <button class="admin-nav__item" type="button" data-view="review" aria-label="Review" title="Review">
          <i class="ph-light ph-check-circle" aria-hidden="true"></i><span>Review</span>
          <span class="admin-nav__count admin-nav__count--attention" id="reviewNavCount">0</span>
        </button>
        <button class="admin-nav__item" type="button" data-view="history" aria-label="Historie" title="Historie">
          <i class="ph-light ph-clock-counter-clockwise" aria-hidden="true"></i><span>Historie</span>
        </button>
        <a class="admin-nav__item" href="https://app-trainquiz-b45lvqbqd7eae.azurewebsites.net" target="_blank" rel="noopener" aria-label="Quiz erstellen" title="Quiz erstellen">
          <i class="ph-light ph-question" aria-hidden="true"></i><span>Quiz erstellen</span>
        </a>
        <button class="admin-nav__item" type="button" data-view="stats" aria-label="Statistik" title="Statistik">
          <i class="ph-light ph-chart-bar" aria-hidden="true"></i><span>Statistik</span>
        </button>
      </nav>

      <div class="admin-sidebar__footer">
        <div class="admin-user">
          <span class="admin-user__avatar" id="adminAvatar" aria-hidden="true">–</span>
          <span class="admin-user__copy">
            <strong id="adminUsername">–</strong>
            <small id="adminRoles">–</small>
          </span>
        </div>
        <a class="admin-back-link" href="index.html">
          <i class="ph-light ph-arrow-left" aria-hidden="true"></i> Zum Katalog
        </a>
      </div>
    </aside>
    <button class="admin-sidebar-backdrop" id="adminSidebarBackdrop" type="button" aria-label="Navigation schließen" hidden></button>

    <div class="admin-workspace">
      <header class="admin-toolbar">
        <button class="admin-icon-button admin-menu-button" id="adminMenuButton" type="button" aria-label="Navigation öffnen" aria-expanded="false" aria-controls="adminSidebar">
          <i class="ph-light ph-list" aria-hidden="true"></i>
        </button>
        <div class="change-context">
          <label for="changesetSelect">Änderungssatz</label>
          <select id="changesetSelect" aria-describedby="saveStatus">
            <option value="">Veröffentlichter Stand</option>
          </select>
          <button class="admin-icon-button" id="newChangesetButton" type="button" aria-label="Neuen Änderungssatz erstellen" title="Neuen Änderungssatz erstellen">
            <i class="ph-light ph-plus" aria-hidden="true"></i>
          </button>
        </div>
        <span class="save-status" id="saveStatus" role="status" aria-live="polite">Nur lesen</span>
        <div class="admin-toolbar__actions">
          <button class="admin-icon-button admin-theme-button" id="adminThemeButton" type="button" aria-label="Farbschema wechseln" title="Farbschema wechseln" aria-pressed="false">
            <i class="ph-light ph-moon" id="adminThemeIcon" aria-hidden="true"></i>
          </button>
          <button class="admin-button admin-button--secondary" id="validateButton" type="button">
            <i class="ph-light ph-shield-check" aria-hidden="true"></i> Prüfen
          </button>
          <button class="admin-button admin-button--primary" id="saveButton" type="button" disabled>
            <i class="ph-light ph-floppy-disk" aria-hidden="true"></i> Entwurf speichern
          </button>
        </div>
      </header>

      <main class="admin-main" id="adminMain" tabindex="-1">
        <section class="admin-view" id="view-overview" data-view-panel="overview" aria-labelledby="overviewTitle"></section>
        <section class="admin-view" id="view-courses" data-view-panel="courses" aria-labelledby="coursesTitle" hidden></section>
        <section class="admin-view" id="view-lessons" data-view-panel="lessons" aria-labelledby="lessonsTitle" hidden></section>
        <section class="admin-view" id="view-paths" data-view-panel="paths" aria-labelledby="pathsTitle" hidden></section>
        <section class="admin-view" id="view-trainers" data-view-panel="trainers" aria-labelledby="trainersTitle" hidden></section>
        <section class="admin-view" id="view-calendar" data-view-panel="calendar" aria-labelledby="calendarTitle" hidden></section>
        <section class="admin-view" id="view-teams" data-view-panel="teams" aria-labelledby="teamsTitle" hidden></section>
        <section class="admin-view" id="view-assistant" data-view-panel="assistant" aria-labelledby="assistantTitle" hidden></section>
        <section class="admin-view" id="view-review" data-view-panel="review" aria-labelledby="reviewTitle" hidden></section>
        <section class="admin-view" id="view-history" data-view-panel="history" aria-labelledby="historyTitle" hidden></section>
        <section class="admin-view" id="view-stats" data-view-panel="stats" aria-labelledby="statsTitle" hidden></section>
      </main>
    </div>
  </div>

  <dialog class="admin-dialog" id="changesetDialog" aria-labelledby="changesetDialogTitle">
    <form method="dialog" id="changesetForm">
      <div class="admin-dialog__header">
        <div>
          <h2 id="changesetDialogTitle">Arbeit nachvollziehbar bündeln</h2>
        </div>
        <button class="admin-icon-button" value="cancel" aria-label="Dialog schließen">
          <i class="ph-light ph-x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="admin-dialog__body">
        <label class="admin-field">
          <span>Titel</span>
          <input id="changesetTitle" name="title" required maxlength="120" autocomplete="off" placeholder="z. B. Agentic Engineering Path überarbeiten">
        </label>
        <label class="admin-field">
          <span>Beschreibung <small>(optional)</small></span>
          <textarea id="changesetDescription" name="description" rows="4" maxlength="1000" placeholder="Welches Curriculum-Problem löst diese Änderung?"></textarea>
        </label>
      </div>
      <div class="admin-dialog__actions">
        <button class="admin-button admin-button--secondary" value="cancel">Abbrechen</button>
        <button class="admin-button admin-button--primary" id="createChangesetButton" value="default">Änderungssatz erstellen</button>
      </div>
    </form>
  </dialog>

  <dialog class="admin-dialog" id="lessonDialog" aria-labelledby="lessonDialogTitle">
    <form method="dialog" id="lessonForm">
      <div class="admin-dialog__header">
        <div>
          <h2 id="lessonDialogTitle">Lesson-Vertrag anlegen</h2>
        </div>
        <button class="admin-icon-button" value="cancel" aria-label="Dialog schließen">
          <i class="ph-light ph-x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="admin-dialog__body">
        <label class="admin-field">
          <span>Phase</span>
          <select id="lessonPhase" required></select>
        </label>
        <label class="admin-field">
          <span>Lesson-Verzeichnis</span>
          <input id="lessonSlug" required pattern="[0-9]{2}-[a-z0-9-]+" placeholder="09-curriculum-evaluation">
        </label>
        <label class="admin-field">
          <span>Englischer Titel</span>
          <input id="lessonTitle" required maxlength="120" placeholder="Curriculum Evaluation">
        </label>
        <label class="admin-field">
          <span>Sprache</span>
          <select id="lessonLanguage">
            <option value="py">Python</option>
            <option value="ts">TypeScript</option>
            <option value="rs">Rust</option>
            <option value="jl">Julia</option>
          </select>
        </label>
      </div>
      <div class="admin-dialog__actions">
        <button class="admin-button admin-button--secondary" value="cancel">Abbrechen</button>
        <button class="admin-button admin-button--primary" value="default">Lesson-Entwurf anlegen</button>
      </div>
    </form>
  </dialog>

  <input id="curriculumImport" type="file" accept=".json,.csv,text/csv,application/json" hidden>
  <dialog class="admin-dialog" id="importDialog" aria-labelledby="importDialogTitle">
    <div class="admin-dialog__header">
      <div>
        <h2 id="importDialogTitle">Änderungen vor Übernahme prüfen</h2>
      </div>
      <button class="admin-icon-button" id="closeImportDialog" type="button" aria-label="Dialog schließen">
        <i class="ph-light ph-x" aria-hidden="true"></i>
      </button>
    </div>
    <div class="admin-dialog__body" id="importSummary"></div>
    <div class="admin-dialog__actions">
      <button class="admin-button admin-button--secondary" id="cancelImport" type="button">Abbrechen</button>
      <button class="admin-button admin-button--primary" id="applyImport" type="button">In Entwurf übernehmen</button>
    </div>
  </dialog>

  <dialog class="admin-dialog admin-dialog--wide" id="conflictDialog" aria-labelledby="conflictDialogTitle">
    <div class="admin-dialog__header">
      <div>
        <h2 id="conflictDialogTitle">Überlappende Änderungen entscheiden</h2>
      </div>
    </div>
    <div class="admin-dialog__body" id="conflictSummary"></div>
    <div class="admin-dialog__actions">
      <button class="admin-button admin-button--secondary" id="cancelConflict" type="button">Remote-Stand neu laden</button>
      <button class="admin-button admin-button--primary" id="applyConflict" type="button">Aufgelösten Entwurf übernehmen</button>
    </div>
  </dialog>

  <div class="admin-toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <script src="admin.js?v=20260831a"></script>
</body>
</html>
