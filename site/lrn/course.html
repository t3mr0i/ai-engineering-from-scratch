<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="../gate.js"></script>
  <script>
    /* D1 — resolve an explicit stored dark-mode choice before first paint,
       same mechanism as lesson.html/llm-primer. Only an explicit stored
       value is applied; with nothing stored the attribute stays unset and
       the prefers-color-scheme media query in lrn/tokens.css keeps
       handling the OS preference. */
    (function () {
      function apply() {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      }
      apply();
      window.addEventListener('storage', function (e) { if (e.key === 'theme') apply(); });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="title_course">Course · LHIND AI Learning Catalog</title>
  <meta name="description" content="Course detail and syllabus in the LHIND AI Learning Catalog.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305164d'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial,sans-serif' font-size='14' font-weight='700' fill='%23f8fafc'%3EAI%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://unpkg.com">
  <!-- Phosphor Light icons (Lufthansa DS substitute for official LHG line-icons).
       CSS webfont path — robust against CDN path changes, no JS dependency. -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/light/style.css">
  <link rel="stylesheet" href="lrn.css?v=20260824a">
</head>
<body>
  <a class="skip-link" href="#courseMain" data-i18n="skip_course_detail">Skip to course detail</a>
  <header class="nav-edge" aria-label="Site navigation">
    <a class="wordmark" href="../index.html">
      <img class="wordmark__logo" src="../assets/logo/lhind-logo-blue.png" alt="LHIND" />
      <span>LHIND Learning Catalog</span>
    </a>
    <div class="nav-edge__spacer" aria-hidden="true" style="flex:1"></div>
    <button type="button" id="darkModeToggle" class="nav-settings theme-toggle" title="Switch color theme" aria-label="Switch color theme">
      <i class="ph-light ph-moon" aria-hidden="true" id="darkModeIcon"></i>
    </button>
    <a href="#" id="langToggle" class="nav-settings lang-toggle theme-toggle" title="Switch language" aria-label="Switch language" data-i18n-title="lang_toggle_title">
      <span id="langIcon" class="theme-icon">EN</span>
    </a>
  </header>

  <main class="page page--detail" id="courseMain">
    <a class="back-link" id="backLinkTop" href="../index.html">
      <i class="ph-light ph-arrow-left" aria-hidden="true"></i> <span data-i18n="back_to_courses">Back to courses</span>
    </a>
    <div id="courseRoot"></div>
  </main>

  <div class="sr-status" id="srStatus" aria-live="polite"></div>

  <script src="../progress.js"></script>
  <script src="data.js"></script>
  <script src="course-formats.js?v=20260824a"></script>
  <script src="curriculum-map.js"></script>
  <script src="../i18n.js"></script>
  <script src="../lang.js"></script>
  <script src="course.js?v=20260824a"></script>
  <script>
    /* D1 — dark-mode toggle button. Wires the button in the header above
       to the same localStorage 'theme' key lesson.html/llm-primer already
       read, so the choice is shared and persisted across the whole site. */
    (function () {
      var btn = document.getElementById('darkModeToggle');
      var icon = document.getElementById('darkModeIcon');
      if (!btn) return;
      function stored() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
      function osDark() { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
      function current() {
        var s = stored();
        return (s === 'dark' || s === 'light') ? s : (osDark() ? 'dark' : 'light');
      }
      function render() {
        var theme = current();
        icon.className = 'ph-light ' + (theme === 'dark' ? 'ph-sun' : 'ph-moon');
        var de = (window.SiteLang ? window.SiteLang.get() : 'en') === 'de';
        var label = theme === 'dark'
          ? (de ? 'Zu hellem Farbschema wechseln' : 'Switch to light color theme')
          : (de ? 'Zu dunklem Farbschema wechseln' : 'Switch to dark color theme');
        btn.title = label;
        btn.setAttribute('aria-label', label);
        btn.setAttribute('aria-pressed', String(theme === 'dark'));
      }
      render();
      btn.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (e) {}
        document.documentElement.setAttribute('data-theme', next);
        render();
      });
      if (window.SiteLang) document.addEventListener('sitelang:change', render);
    })();
  </script>
</body>
</html>
