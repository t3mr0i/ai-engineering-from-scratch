<!DOCTYPE html>
<html lang="de">
<head>
  <script src="/gate-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LHIND · Skill-Nachweis prüfen</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/light/style.css">
  <link rel="stylesheet" href="lrn/lrn.css?v=20260825d">
  <link rel="stylesheet" href="pan.css?v=20260830a">
</head>
<body>
  <a class="skip-link" href="#credentialMain">Zum Nachweis</a>
  <header class="nav-edge" aria-label="Seitennavigation">
    <a class="wordmark" href="index.html"><img class="wordmark__logo" src="assets/logo/lhind-logo-blue.png" alt="LHIND"><span>AI Learning Catalog</span></a>
  </header>
  <main class="credential-page" id="credentialMain" tabindex="-1">
    <section class="credential-card" id="credentialCard" aria-labelledby="credentialTitle" aria-busy="true">
      <p class="team-learning__eyebrow">Skill evidence</p>
      <h1 id="credentialTitle">Nachweis wird geprüft.</h1>
      <p id="credentialStatus" role="status">Signatur und Herausgeberdaten werden serverseitig validiert.</p>
    </section>
  </main>
  <script>
    (async function () {
      const card = document.getElementById('credentialCard');
      const title = document.getElementById('credentialTitle');
      const status = document.getElementById('credentialStatus');
      const params = new URLSearchParams(location.search);
      const id = params.get('id') || '';
      const proof = params.get('proof') || '';
      function row(label, value) {
        const item = document.createElement('div');
        item.className = 'credential-row';
        const term = document.createElement('dt'); term.textContent = label;
        const detail = document.createElement('dd'); detail.textContent = value;
        item.append(term, detail); return item;
      }
      try {
        if (!/^cred-[0-9a-f-]{36}$/.test(id) || proof.length < 20 || proof.length > 200) throw new Error('Der Prüf-Link ist ungültig.');
        const response = await fetch('/api/lrn/credentials/' + encodeURIComponent(id) + '?proof=' + encodeURIComponent(proof), { credentials: 'same-origin' });
        const body = await response.json();
        if (!response.ok || !body.valid) throw new Error(body && body.error && body.error.message || 'Der Nachweis ist ungültig.');
        const value = body.credential;
        title.textContent = value.capabilityTitle;
        status.textContent = 'Gültiger LHIND Skill-Nachweis';
        status.className = 'credential-valid';
        const list = document.createElement('dl');
        list.className = 'credential-details';
        list.append(
          row('Mastery', value.percent + '%'),
          row('Quiz-Evidenz', value.evidenceCount + ' Beobachtungen'),
          row('Applied Evidence', value.appliedEvidenceCount + ' bestandene ausführbare Self-Checks'),
          row('Ausgestellt', new Date(value.issuedAt).toLocaleDateString('de-DE')),
          row('Lernenden-Referenz', value.learnerRef),
          row('Aussagekraft', 'Herausgeber- und Evidenzintegrität; keine Identitäts- oder Prüfungsbestätigung')
        );
        card.appendChild(list);
      } catch (error) {
        title.textContent = 'Nachweis nicht verifiziert.';
        status.textContent = error.message;
        status.className = 'credential-invalid';
      } finally {
        card.setAttribute('aria-busy', 'false');
      }
    })();
  </script>
</body>
</html>
