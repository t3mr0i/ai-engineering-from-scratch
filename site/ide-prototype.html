<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser IDE — Prototype</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ── LHIND tokens (mirrors site/style.css, dark by default like Scrimba) ── */
    :root {
      --font-mono: 'JetBrains Mono', ui-monospace, 'Consolas', monospace;
      --bg: #191919;
      --bg-surface: #1a1f2e;
      --panel: #14161c;
      --ink: #ffffff;
      --ink-soft: rgba(255, 255, 255, 0.7);
      --ink-mute: rgba(255, 255, 255, 0.5);
      --rule-soft: rgba(255, 255, 255, 0.16);
      --blueprint: #8aa5ff;
      --blueprint-tint: rgba(138, 165, 255, 0.12);
      --code-bg: #1a1f2e;
      --ok: #4ade80;
      --err: #f87171;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-mono);
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      height: 38px;
      flex: 0 0 38px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: var(--blueprint);
      color: #fff;
      border-bottom: 1px solid rgba(0,0,0,0.3);
    }
    .topbar .brand {
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 12px;
      text-transform: uppercase;
    }
    .topbar .file-name { color: rgba(255,255,255,0.85); font-size: 12px; }
    .topbar .spacer { flex: 1; }
    .topbar .badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 2px 8px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 2px;
      opacity: 0.85;
    }

    /* ── Main 3-column layout: files | editor | output ── */
    .workbench {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: 200px 1fr 1fr;
      min-height: 0;
    }

    /* Files sidebar */
    .files {
      background: var(--panel);
      border-right: 1px solid var(--rule-soft);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .files-head {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-mute);
      padding: 10px 12px 6px;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--ink-soft);
      border-left: 2px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item:hover { background: var(--blueprint-tint); }
    .file-item.active {
      color: var(--ink);
      background: var(--blueprint-tint);
      border-left-color: var(--blueprint);
    }
    .file-item .ico { color: var(--blueprint); flex: 0 0 auto; }
    .files-foot {
      margin-top: auto;
      padding: 8px 12px;
      border-top: 1px solid var(--rule-soft);
    }
    .files-foot button {
      width: 100%;
      background: transparent;
      border: 1px solid var(--rule-soft);
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px;
      cursor: pointer;
    }
    .files-foot button:hover { border-color: var(--blueprint); color: var(--blueprint); }

    /* Editor column */
    .editor-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--rule-soft);
    }
    .tabs {
      display: flex;
      flex: 0 0 32px;
      background: var(--panel);
      border-bottom: 1px solid var(--rule-soft);
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 14px;
      font-size: 12px;
      color: var(--ink-mute);
      cursor: pointer;
      border-right: 1px solid var(--rule-soft);
      white-space: nowrap;
    }
    .tab.active { color: var(--ink); background: var(--code-bg); }
    #editor { flex: 1 1 auto; min-height: 0; }

    /* Output column */
    .output-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--panel);
    }
    .runner-bar {
      flex: 0 0 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border-bottom: 1px solid var(--rule-soft);
      font-size: 11px;
      color: var(--ink-mute);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .runner-bar .spacer { flex: 1; }
    .run-btn {
      background: var(--blueprint);
      color: #0b1020;
      border: none;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 16px;
      cursor: pointer;
    }
    .run-btn:hover:not(:disabled) { filter: brightness(1.1); }
    .run-btn:disabled { opacity: 0.5; cursor: default; }
    .output {
      flex: 1 1 auto;
      margin: 0;
      padding: 14px 16px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--ink-soft);
    }
    .output .ok { color: var(--ok); }
    .output .err { color: var(--err); }
    .output .meta { color: var(--ink-mute); font-style: italic; }

    /* Mobile: stack */
    @media (max-width: 880px) {
      .workbench { grid-template-columns: 1fr; grid-template-rows: auto 1fr 1fr; }
      .files { flex-direction: row; overflow-x: auto; }
      .files-foot { margin-top: 0; border-top: none; border-left: 1px solid var(--rule-soft); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand">LHIND · AI IDE</span>
    <span class="file-name" id="activeFileName">main.py</span>
    <span class="spacer"></span>
    <span class="badge" id="runtimeBadge">runtime: pyodide (prototype)</span>
  </div>

  <div class="workbench">
    <!-- Files -->
    <aside class="files">
      <div class="files-head">Files</div>
      <div id="fileList"></div>
      <div class="files-foot">
        <button id="addFileBtn" type="button">+ New file</button>
      </div>
    </aside>

    <!-- Editor -->
    <section class="editor-col">
      <div class="tabs" id="tabs"></div>
      <div id="editor"></div>
    </section>

    <!-- Output -->
    <section class="output-col">
      <div class="runner-bar">
        <span>Output</span>
        <span class="spacer"></span>
        <button class="run-btn" id="runBtn" type="button">▶ Run</button>
      </div>
      <pre class="output" id="output"><span class="meta">Press Run to execute the active file.</span></pre>
    </section>
  </div>

  <!-- Monaco: the real VS Code editor engine (same as Scrimba) -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script>
  (function () {
    'use strict';

    // ── In-memory file system. Later this becomes the payload sent to the
    //    backend runner; for now Pyodide executes it locally. ──
    var FILES = {
      'main.py': [
        'import sys',
        'print("Python", sys.version.split()[0])',
        '',
        '# This is the Scrimba-style prototype. The editor is Monaco',
        '# (the real VS Code engine). The runtime here is Pyodide — a',
        '# placeholder. It will be swapped for a backend that runs real',
        '# Python with LLM libraries (anthropic, openai, ...).',
        '',
        'total = sum(range(1, 11))',
        'print("sum 1..10 =", total)',
        ''
      ].join('\n'),
      'helper.py': [
        'def greet(name):',
        '    return f"Hello, {name}!"',
        '',
        '# Import this from main.py once the backend FS is wired up.',
        ''
      ].join('\n')
    };

    var activeFile = 'main.py';
    var editor = null;
    var models = {};   // filename -> monaco model

    // ── Boot Monaco ──
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      monaco.editor.defineTheme('lhind-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [],
        colors: {
          'editor.background': '#1a1f2e',
          'editor.lineHighlightBackground': '#222842'
        }
      });

      Object.keys(FILES).forEach(function (name) {
        models[name] = monaco.editor.createModel(FILES[name], langFor(name));
      });

      editor = monaco.editor.create(document.getElementById('editor'), {
        model: models[activeFile],
        theme: 'lhind-dark',
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 13,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        padding: { top: 12 }
      });

      // Keep FILES in sync so Run sends the latest content.
      editor.onDidChangeModelContent(function () {
        FILES[activeFile] = editor.getValue();
      });

      // Ctrl/Cmd+Enter to run.
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, run);

      renderFiles();
      renderTabs();
    });

    function langFor(name) {
      if (/\.py$/.test(name)) return 'python';
      if (/\.(js|mjs)$/.test(name)) return 'javascript';
      if (/\.json$/.test(name)) return 'json';
      if (/\.md$/.test(name)) return 'markdown';
      return 'plaintext';
    }

    // ── File list + tabs ──
    function renderFiles() {
      var list = document.getElementById('fileList');
      list.innerHTML = '';
      Object.keys(FILES).forEach(function (name) {
        var el = document.createElement('div');
        el.className = 'file-item' + (name === activeFile ? ' active' : '');
        el.innerHTML = '<span class="ico">›</span><span>' + escapeHtml(name) + '</span>';
        el.addEventListener('click', function () { switchTo(name); });
        list.appendChild(el);
      });
    }

    function renderTabs() {
      var tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      Object.keys(FILES).forEach(function (name) {
        var el = document.createElement('div');
        el.className = 'tab' + (name === activeFile ? ' active' : '');
        el.textContent = name;
        el.addEventListener('click', function () { switchTo(name); });
        tabs.appendChild(el);
      });
    }

    function switchTo(name) {
      activeFile = name;
      if (editor) editor.setModel(models[name]);
      document.getElementById('activeFileName').textContent = name;
      renderFiles();
      renderTabs();
    }

    document.getElementById('addFileBtn').addEventListener('click', function () {
      var name = prompt('New file name (e.g. utils.py):');
      if (!name) return;
      if (FILES[name] != null) { switchTo(name); return; }
      FILES[name] = '';
      models[name] = monaco.editor.createModel('', langFor(name));
      switchTo(name);
    });

    // ── RUN: the single seam between UI and runtime. ──
    //   If a backend runner is configured, run there — real Python on Azure
    //   (Container App, /run endpoint). Otherwise fall back to the in-browser
    //   Pyodide runtime (offline-friendly). LLM calls are a separate path: the
    //   browser talks to Bifrost directly (the gateway only allows the LHIND
    //   network, not Azure egress), so lesson LLM code runs client-side.
    //   Override the runner via window.LESSON_IDE_BACKEND_URL if needed.
    var DEFAULT_RUNNER = 'https://lhindide-runner.ashybush-9d1ef906.germanywestcentral.azurecontainerapps.io';
    var BACKEND_URL = (window.LESSON_IDE_BACKEND_URL || DEFAULT_RUNNER).replace(/\/$/, '');
    var runBtn = document.getElementById('runBtn');
    var outputEl = document.getElementById('output');
    var badge = document.getElementById('runtimeBadge');
    if (BACKEND_URL) badge.textContent = 'runtime: backend';
    runBtn.addEventListener('click', run);

    function run() {
      runBtn.disabled = true;
      runBtn.textContent = 'Running…';
      outputEl.innerHTML = BACKEND_URL
        ? '<span class="meta">Running in sandbox…</span>'
        : '<span class="meta">Loading runtime…</span>';
      var started = performance.now();

      var runner = BACKEND_URL ? runCodeBackend : runCodePyodide;
      runner(FILES, activeFile).then(function (res) {
        var ms = Math.round(performance.now() - started);
        var cls = res.ok ? 'ok' : 'err';
        var body = escapeHtml(res.output || '(no output)');
        outputEl.innerHTML =
          '<span class="' + cls + '">' + (res.ok ? '✓ ran' : '✗ error') + '</span>' +
          ' <span class="meta">· ' + ms + ' ms</span>\n\n' + body;
      }).catch(function (err) {
        outputEl.innerHTML = '<span class="err">✗ ' + escapeHtml(String(err)) + '</span>';
      }).then(function () {
        runBtn.disabled = false;
        runBtn.textContent = '▶ Run';
      });
    }

    // ── Backend runtime ──
    //   POSTs the file set to the orchestrator /run. The orchestrator (behind
    //   Entra EasyAuth) routes it to this user's sandbox. Same request/response
    //   contract the runner image was tested against:
    //     request:  { files: {name: content, ...}, entry: "main.py" }
    //     response: { ok, output, exit_code, duration_ms, timed_out, truncated }
    function runCodeBackend(files, entry) {
      return fetch(BACKEND_URL + '/run', {
        method: 'POST',
        credentials: 'include',           // carry the EasyAuth session
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: files, entry: entry })
      }).then(function (r) {
        if (r.status === 401) {
          // EasyAuth wants a fresh sign-in; send the user through it.
          window.location.href = BACKEND_URL + '/.auth/login/aad?post_login_redirect_uri='
            + encodeURIComponent(window.location.href);
          return { ok: false, output: 'Redirecting to sign-in…' };
        }
        if (!r.ok) return r.text().then(function (t) {
          return { ok: false, output: 'backend error ' + r.status + '\n' + t };
        });
        return r.json();
      });
    }

    // ── Pyodide fallback runtime ──
    //    Writes every file into the Pyodide FS, then runs the active one,
    //    so `import helper` works across files — same contract the backend
    //    runner honors.
    var _pyodide = null;
    function loadPyodide_() {
      if (_pyodide) return _pyodide;
      _pyodide = new Promise(function (resolve, reject) {
        var CDN = 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/';
        var s = document.createElement('script');
        s.src = CDN + 'pyodide.js';
        s.onload = function () { window.loadPyodide({ indexURL: CDN }).then(resolve, reject); };
        s.onerror = function () { reject(new Error('Failed to load Pyodide')); };
        document.head.appendChild(s);
      });
      return _pyodide;
    }

    function runCodePyodide(files, entry) {
      return loadPyodide_().then(function (py) {
        var buf = [];
        py.setStdout({ batched: function (s) { buf.push(s); } });
        py.setStderr({ batched: function (s) { buf.push(s); } });
        Object.keys(files).forEach(function (name) {
          if (/\.py$/.test(name)) py.FS.writeFile(name, files[name]);
        });
        var code = files[entry] || '';
        return py.loadPackagesFromImports(code).catch(function () {})
          .then(function () { return py.runPythonAsync(code); })
          .then(function () { return { ok: true, output: buf.join('') }; })
          .catch(function (err) { return { ok: false, output: buf.join('') + '\n' + String(err.message || err) }; });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  })();
  </script>
</body>
</html>
