      // Libraries with no Pyodide/WASM wheel — these lessons can't run in-browser.
      var PY_NO_WASM = /^\s*(?:import|from)\s+(torch|tensorflow|jax|cupy|transformers|flax)\b/m;

      // Lazy, cached Pyodide loader. Resolves to the pyodide instance.
      var _pyodidePromise = null;
      function loadPyodide_() {
        if (_pyodidePromise) return _pyodidePromise;
        _pyodidePromise = new Promise(function (resolve, reject) {
          var CDN = 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/';
          var s = document.createElement('script');
          s.src = CDN + 'pyodide.js';
          s.onload = function () {
            window.loadPyodide({ indexURL: CDN }).then(resolve, reject);
          };
          s.onerror = function () { reject(new Error('Failed to load Pyodide')); };
          document.head.appendChild(s);
        });
        return _pyodidePromise;
      }

      function renderCodePanel(container) {
        var panel = document.createElement('div');
        panel.className = 'ai-panel';
        panel.innerHTML = '<div class="ai-panel-header"><div class="ai-panel-icon">C</div><div class="ai-panel-title">Run the Code</div></div><div class="ai-panel-subtitle">A live Jupyter notebook, right here in your browser</div><div id="codeContent" class="panel-loading">Loading code…</div>';
        container.appendChild(panel);

        var codeUrl = lessonPath + '/code/main.py';
        var gitlabUrl = 'https://git02.lhind.app.lufthansa.com/lhind/pace/agentic-software-engineering/ai-training/-/tree/main/' + lessonPath;
        // JupyterLite single-notebook view, served from the same site under
        // jupyterlite/. Embedded in-page via iframe (same origin → no CORS,
        // no mixed-content, no login). Loaded on demand to keep the page fast.
        var notebookUrl = 'jupyterlite/notebooks/index.html?path=' + lessonPath + '.ipynb';
        var notebookFull = 'jupyterlite/lab/index.html?path=' + lessonPath + '.ipynb';

        fetch(codeUrl)
          .then(function (r) { if (!r.ok) throw new Error('no main.py'); return r.text(); })
          .then(function (src) { mountNotebook(src); })
          .catch(function () {
            // No main.py — still offer the notebook (it may exist) + GitLab.
            mountNotebook(null);
          });

        function mountNotebook(src) {
          var el = document.getElementById('codeContent');
          var heavy = src && PY_NO_WASM.test(src);
          var note = heavy
            ? 'This lesson uses a library (e.g. PyTorch) that needs a local machine or GPU. The notebook shows the saved output already — open it to read and edit; run it locally for live results.'
            : 'The notebook opens with the results already shown. Edit any cell and press ▶ to re-run it live in your browser (the Python kernel runs locally — nothing leaves your machine).';

          el.innerHTML =
            '<div class="nb-placeholder" id="nbPlaceholder">' +
            '<div class="nb-hint">' + note + '</div>' +
            '<button class="nb-start-btn" id="nbStart">Open notebook</button>' +
            '<div class="nb-hint" style="opacity:.7">Results are pre-computed and visible immediately. Re-running a cell loads the Python runtime (a few seconds).</div>' +
            '</div>';

          document.getElementById('nbStart').addEventListener('click', function () {
            el.innerHTML =
              '<div class="nb-embed">' +
              '<div class="nb-embed-bar">' +
              '<span>Jupyter · ' + escapeHtml(lessonPath.split('/').pop()) + '</span>' +
              '<span class="spacer"></span>' +
              '<a href="' + notebookFull + '" target="_blank" rel="noopener">Open full screen ↗</a>' +
              '<a href="' + gitlabUrl + '" target="_blank" rel="noopener">View on GitLab</a>' +
              '</div>' +
              '<div class="nb-loading" id="nbLoading" style="padding:14px">Loading notebook…</div>' +
              '<iframe class="nb-frame" id="nbFrame" title="Lesson notebook" ' +
              'src="' + notebookUrl + '" allow="cross-origin-isolated"></iframe>' +
              '</div>';
            var frame = document.getElementById('nbFrame');
            frame.style.visibility = 'hidden';

        // (legacy pyodide playground retained below but no longer mounted)
        function mountPlayground(src) {
          var el = document.getElementById('codeContent');
          var runLocal = 'python ' + lessonPath + '/code/main.py';

          // Heavy-lib lessons can't run in the browser — show run-locally guidance.
          if (PY_NO_WASM.test(src)) {
            el.innerHTML =
              '<div class="code-card">' +
              '<div class="code-card-header"><span class="code-lang-icon">PY</span><span class="code-card-name">main.py</span></div>' +
              '<div class="code-note">This lesson uses a library (e.g. PyTorch) that needs a local machine or GPU, so it can’t run in the browser. Run it locally:</div>' +
              '<div class="code-card-run">' + escapeHtml(runLocal) + '</div>' +
              '<div class="code-card-actions">' +
              '<a class="code-card-btn" href="' + notebookFull + '" target="_blank" rel="noopener">Open in Notebook</a>' +
              '<a class="code-card-btn" href="' + gitlabUrl + '" target="_blank" rel="noopener">View on GitLab</a>' +
              '<button class="code-card-btn code-card-copy" data-command="' + escapeAttr(runLocal) + '">Copy command</button>' +
              '</div></div>';
            wireCopy(el);
            return;
          }

          el.innerHTML =
            '<div class="code-playground">' +
            '<textarea class="code-editor" spellcheck="false"></textarea>' +
            '<div class="code-card-actions">' +
            '<button class="code-card-btn code-run">▶ Run</button>' +
            '<button class="code-card-btn code-reset">Reset</button>' +
            '<a class="code-card-btn" href="' + notebookFull + '" target="_blank" rel="noopener">Open in Notebook</a>' +
            '<a class="code-card-btn" href="' + gitlabUrl + '" target="_blank" rel="noopener">View on GitLab</a>' +
            '<span class="code-run-status"></span>' +
            '</div>' +
            '<pre class="code-output" hidden></pre>' +
            '</div>';

          var editor = el.querySelector('.code-editor');
          var runBtn = el.querySelector('.code-run');
          var resetBtn = el.querySelector('.code-reset');
          var status = el.querySelector('.code-run-status');
          var output = el.querySelector('.code-output');
          editor.value = src;

          resetBtn.addEventListener('click', function () { editor.value = src; });

          runBtn.addEventListener('click', function () {
            runBtn.disabled = true;
            status.textContent = 'Loading Python…';
            output.hidden = false;
            output.textContent = '';
            output.className = 'code-output';

            loadPyodide_().then(function (py) {
              status.textContent = 'Running…';
              var buf = [];
              py.setStdout({ batched: function (s) { buf.push(s); } });
              py.setStderr({ batched: function (s) { buf.push(s); } });
              var code = editor.value;
              // Load any imported packages that have wheels (numpy, scipy, …).
              return py.loadPackagesFromImports(code)
                .catch(function () { /* unknown import → let runPython raise */ })
                .then(function () { return py.runPythonAsync(code); })
                .then(function () {
                  output.textContent = buf.join('') || '(no output)';
                  status.textContent = 'Done';
                })
                .catch(function (err) {
                  output.textContent = buf.join('') + '\n' + String(err.message || err);
                  output.className = 'code-output code-output-error';
                  status.textContent = 'Error';
                });
            }).catch(function (err) {
              output.textContent = String(err.message || err);
              output.className = 'code-output code-output-error';
              status.textContent = 'Failed to load Python';
            }).then(function () {
              runBtn.disabled = false;
            });
          });
        }

        function wireCopy(el) {
          el.querySelectorAll('.code-card-copy').forEach(function (btn) {
            btn.addEventListener('click', function () {
              navigator.clipboard.writeText(btn.getAttribute('data-command')).then(function () {
                btn.textContent = 'Copied!';
                setTimeout(function () { btn.textContent = 'Copy command'; }, 1500);
              });
            });
          });
        }
      }

          phase = fl.phaseSlug || '';
        }

        var html = '<div class="ai-panel-header"><div class="ai-panel-icon">Q</div><div class="ai-panel-title">Test Your Understanding</div></div>';
        html += '<div class="ai-panel-subtitle">Did you get it?</div>';
        html += '<div class="quiz-container" id="quizContainer">';

        var letters = ['A', 'B', 'C', 'D'];
        questions.forEach(function (q, qi) {
          html += '<div class="quiz-question" id="quiz-q-' + qi + '">';
          html += '<div class="quiz-question-num">Question ' + (qi + 1) + ' of ' + questions.length + '</div>';
          html += '<div class="quiz-question-text">' + escapeHtml(q.q) + '</div>';
          html += '<div class="quiz-options">';
          q.opts.forEach(function (opt, oi) {
            html += '<button class="quiz-option" data-qi="' + qi + '" data-oi="' + oi + '" onclick="handleQuizAnswer(' + qi + ',' + oi + ')">';
            html += '<span class="opt-letter">' + letters[oi] + '</span>';
            html += '<span>' + escapeHtml(opt) + '</span>';
            html += '</button>';
          });
          html += '</div>';
          html += '<div class="quiz-explanation" id="quiz-explain-' + qi + '">' + escapeHtml(q.explain) + '</div>';
          html += '</div>';
        });

        html += '<div class="quiz-score" id="quizScore"><div class="quiz-score-number" id="quizScoreNum">0/' + questions.length + '</div><div class="quiz-score-label">Complete all questions to see your score</div></div>';
        html += '<div class="quiz-deeper">Want a deeper quiz? Run <code>/check-understanding ' + escapeHtml(phase) + '</code> in Claude, Cursor, Codex, OpenClaw, Hermes, or any agent with the curriculum skills installed</div>';
        html += '</div>';

        panel.innerHTML = html;
        container.appendChild(panel);

        window._quizData = questions;
        window._quizAnswered = 0;
        window._quizCorrect = 0;
      }

      window.handleQuizAnswer = function (qi, oi) {
        var questions = window._quizData;
        if (!questions) return;

        var qEl = document.getElementById('quiz-q-' + qi);
        if (!qEl) return;
        var opts = qEl.querySelectorAll('.quiz-option');
        if (opts[0].classList.contains('disabled')) return;

        var correct = questions[qi].answer;
        opts.forEach(function (opt, i) {
          opt.classList.add('disabled');
          if (i === oi) {
            opt.classList.add('selected');
            opt.classList.add(i === correct ? 'correct' : 'wrong');
          }
          if (i === correct) {
            opt.classList.add('is-answer');
          }
        });

        var explain = document.getElementById('quiz-explain-' + qi);
        if (explain) explain.classList.add('visible');

        window._quizAnswered++;
        if (oi === correct) window._quizCorrect++;

        if (window._quizAnswered === questions.length) {
          var scoreEl = document.getElementById('quizScore');
          var scoreNum = document.getElementById('quizScoreNum');
          if (scoreEl && scoreNum) {
            scoreNum.textContent = window._quizCorrect + '/' + questions.length;
            scoreEl.querySelector('.quiz-score-label').textContent =
              window._quizCorrect === questions.length ? 'Perfect score!' :
              window._quizCorrect >= 2 ? 'Great work!' : 'Keep studying!';
            scoreEl.classList.add('visible');
          }
        }
      };

      function renderLearningPathPanel(container) {
        if (lrnContext) return renderLrnLearningPathPanel(container);
        if (currentLessonIndex < 0 || typeof PHASES === 'undefined') return;

        var panel = document.createElement('div');
        panel.className = 'ai-panel';

        var current = flatLessons[currentLessonIndex];
        var phaseIdx = current.phaseIndex;
        var phase = PHASES[phaseIdx];
        var lessonsInPhase = [];
        var currentIdxInPhase = -1;

        for (var i = 0; i < flatLessons.length; i++) {
          if (flatLessons[i].phaseIndex === phaseIdx) {
            if (i === currentLessonIndex) currentIdxInPhase = lessonsInPhase.length;
            lessonsInPhase.push({ flat: flatLessons[i], flatIdx: i });
          }
        }

        var html = '<div class="ai-panel-header"><div class="ai-panel-icon">P</div><div class="ai-panel-title">Learning Path</div></div>';
        html += '<div class="ai-panel-subtitle">Phase ' + String(phase.id).padStart(2, '0') + ': ' + escapeHtml(phase.name) + '</div>';

        // Window: 2 before current + current + 2 after, cap at 5 visible.
        var windowSize = 5;
        var startIdx = Math.max(0, currentIdxInPhase - 2);
        var endIdx = Math.min(lessonsInPhase.length, startIdx + windowSize);
        startIdx = Math.max(0, endIdx - windowSize);
        var visible = lessonsInPhase.slice(startIdx, endIdx);
        var hiddenBefore = startIdx;
        var hiddenAfter = lessonsInPhase.length - endIdx;

        html += '<div class="learning-timeline">';
        if (hiddenBefore > 0) {
          html += '<span class="timeline-ellipsis" title="' + hiddenBefore + ' earlier lessons">&laquo; ' + hiddenBefore + '</span>';
          html += '<div class="timeline-line done"></div>';
        }
        visible.forEach(function (item, vIdx) {
          var idx = startIdx + vIdx;
          var isCurrent = idx === currentIdxInPhase;
          var isPrev = idx < currentIdxInPhase;
          var cls = isCurrent ? 'current' : isPrev ? 'prev' : '';

          if (vIdx > 0) {
            var lineCls = idx <= currentIdxInPhase ? (idx === currentIdxInPhase ? 'active' : 'done') : '';
            html += '<div class="timeline-line ' + lineCls + '"></div>';
          }

          if (item.flat.isReadable) {
            html += '<a class="timeline-item ' + cls + '" href="lesson.html?path=' + item.flat.path + '" title="' + escapeAttr(item.flat.lessonName) + '">';
          } else {
            html += '<span class="timeline-item ' + cls + ' disabled" title="' + escapeAttr(item.flat.lessonName) + '">';
          }
          html += '<div class="timeline-dot"></div>';
          html += '<div class="timeline-label">' + escapeHtml(item.flat.lessonName) + '</div>';
          html += item.flat.isReadable ? '</a>' : '</span>';
        });
        if (hiddenAfter > 0) {
          html += '<div class="timeline-line"></div>';
          html += '<span class="timeline-ellipsis" title="' + hiddenAfter + ' later lessons">' + hiddenAfter + ' &raquo;</span>';
        }
        html += '</div>';

        var completedCount = currentIdxInPhase + 1;
        var totalCount = lessonsInPhase.length;
        var pct = Math.round((completedCount / totalCount) * 100);

        html += '<div class="phase-progress-bar"><div class="phase-progress-fill" style="width:' + pct + '%"></div></div>';
        html += '<div class="phase-progress-text">You\'ve completed ' + completedCount + ' of ' + totalCount + ' lessons in this phase</div>';

        if (completedCount >= totalCount && phaseIdx < PHASES.length - 1) {
          var nextPhase = null;
          for (var npi = phaseIdx + 1; npi < PHASES.length; npi++) {
            if (!PHASES[npi].hidden) { nextPhase = PHASES[npi]; break; }
          }
          if (nextPhase) {
            html += '<div class="phase-complete-callout visible">Ready for Phase ' + String(nextPhase.id).padStart(2, '0') + ': ' + escapeHtml(nextPhase.name) + '</div>';
          }
        }

        panel.innerHTML = html;
        container.appendChild(panel);
      }

      function renderLrnLearningPathPanel(container) {
        var panel = document.createElement('div');
        panel.className = 'ai-panel';

        var html = '<div class="ai-panel-header"><div class="ai-panel-icon">P</div><div class="ai-panel-title">LRN Kurspfad</div></div>';
        html += '<div class="ai-panel-subtitle">' + escapeHtml(lrnContext.course.id) + ': ' + escapeHtml(lrnContext.course.title) + '</div>';

        var windowSize = 7;
        var startIdx = Math.max(0, lrnContext.currentIndex - 3);
        var endIdx = Math.min(lrnContext.lessons.length, startIdx + windowSize);
        startIdx = Math.max(0, endIdx - windowSize);
        var visible = lrnContext.lessons.slice(startIdx, endIdx);
        var hiddenBefore = startIdx;
        var hiddenAfter = lrnContext.lessons.length - endIdx;

        html += '<div class="learning-timeline">';
        if (hiddenBefore > 0) {
          html += '<span class="timeline-ellipsis" title="' + hiddenBefore + ' vorherige Lessons">&laquo; ' + hiddenBefore + '</span>';
          html += '<div class="timeline-line done"></div>';
        }
        visible.forEach(function (item, vIdx) {
          var idx = startIdx + vIdx;
          var isCurrent = idx === lrnContext.currentIndex;
          var isPrev = idx < lrnContext.currentIndex;
          var cls = isCurrent ? 'current' : isPrev ? 'prev' : '';

          if (vIdx > 0) {
            var lineCls = idx <= lrnContext.currentIndex ? (idx === lrnContext.currentIndex ? 'active' : 'done') : '';
            html += '<div class="timeline-line ' + lineCls + '"></div>';
          }

          html += '<a class="timeline-item ' + cls + '" href="' + lrnLessonHref(item.path) + '" title="' + escapeAttr(item.title) + '">';
          html += '<div class="timeline-dot"></div>';
          html += '<div class="timeline-label">' + escapeHtml(item.title) + '</div>';
          html += '</a>';
        });
        if (hiddenAfter > 0) {
          html += '<div class="timeline-line"></div>';
          html += '<span class="timeline-ellipsis" title="' + hiddenAfter + ' weitere Lessons">' + hiddenAfter + ' &raquo;</span>';
        }
        html += '</div>';

        html += '<div class="phase-progress-bar"><div class="phase-progress-fill" style="width:' + lrnContext.percent + '%"></div></div>';
        html += '<div class="phase-progress-text">LRN-Fortschritt: ' + lrnContext.completed + ' von ' + lrnContext.total + ' Lessons im Kurs erledigt</div>';

        panel.innerHTML = html;
        container.appendChild(panel);
      }

      function renderContinuePanel(container) {
        if (lrnContext) return renderLrnContinuePanel(container);
        if (currentLessonIndex < 0) return;

        var panel = document.createElement('div');
        panel.className = 'ai-panel';

        var next = null;
        for (var ci = currentLessonIndex + 1; ci < flatLessons.length; ci++) {
          if (flatLessons[ci].isReadable && !flatLessons[ci].phaseHidden) { next = flatLessons[ci]; break; }
        }
        var current = flatLessons[currentLessonIndex];
        var phaseIdx = current.phaseIndex;
        var phase = PHASES[phaseIdx];

        var html = '<div class="ai-panel-header"><div class="ai-panel-icon">N</div><div class="ai-panel-title">Continue Learning</div></div>';
        html += '<div class="continue-panel">';

        if (!next || !next.path) {
          html += '<div class="phase-finished">\u2705 You finished this phase!</div>';
        }

        html += '<div class="continue-links">';

        var phaseSlug = extractPhaseSlug(phase, phaseIdx);
        var firstLesson = phase.lessons[0] ? extractLessonSlug(phase.lessons[0], 0) : '';
        html += '<a class="continue-link" href="lesson.html?path=phases/' + phaseSlug + '/' + firstLesson + '">Browse all Phase ' + String(phase.id).padStart(2, '0') + ' lessons</a>';
        html += '<a class="continue-link" href="catalog.html">Full course catalog</a>';
        html += '</div>';

        html += '<div class="continue-callout">Run <code>/find-your-level</code> in Claude, Cursor, Codex, OpenClaw, Hermes, or any agent with the curriculum skills installed for a personalized learning path</div>';
        html += '</div>';

        panel.innerHTML = html;
        container.appendChild(panel);
      }

      function renderLrnContinuePanel(container) {
        var panel = document.createElement('div');
        panel.className = 'ai-panel';

        var html = '<div class="ai-panel-header"><div class="ai-panel-icon">N</div><div class="ai-panel-title">Weiter im LRN-Kurs</div></div>';
        html += '<div class="continue-panel">';
        html += '<div class="continue-links">';
        if (lrnContext.next) {
          html += '<a class="continue-link" href="' + lrnLessonHref(lrnContext.next.path) + '">Nächste Lesson: ' + escapeHtml(lrnContext.next.title) + '</a>';
        } else {
          html += '<div class="phase-finished">LRN-Kurs vollständig durchlaufen</div>';
        }
        html += '<a class="continue-link" href="index.html">Zurück zum LRN Course Cockpit</a>';
        html += '</div>';
        html += '<div class="continue-callout">Dieser Kurs zeigt nur die Lessons, die für <code>' + escapeHtml(lrnContext.course.id) + '</code> kuratiert wurden. Weitere Curriculum-Lessons bleiben im Katalog, sind aber nicht Teil dieses LRN-Pfads.</div>';
        html += '</div>';

        panel.innerHTML = html;
        container.appendChild(panel);
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function escapeAttr(str) {
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
    })();
  </script>
</body>
</html>
