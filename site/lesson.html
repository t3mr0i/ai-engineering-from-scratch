  <script>
    /* Embedded lessons (llm-primer/index.html) resolve their theme from
       localStorage 'theme'; this page only ever responded to the OS
       prefers-color-scheme media query in lrn/tokens.css. An explicit dark
       choice therefore darkened the iframe while header and chapter sidebar
       stayed light — one page, two themes. Resolve the same key here, and
       keep both sides in sync while the page is open. Only an explicit
       stored value is applied: with nothing stored, the attribute stays as
       authored and the media query keeps handling the OS preference. */
    (function () {
      function apply() {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      }
      apply();
      window.addEventListener('storage', function (e) { if (e.key === 'theme') apply(); });
    })();
  </script>

    /* Collapsed-by-default code blocks. Native <details>; summary is the toggle. */
    .code-collapse {
      margin: 18px 0;
      border: 1px solid var(--rule-soft);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-surface);
    }

    .code-collapse > .code-collapse__summary {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      list-style: none;
      font-family: var(--font-body);
      user-select: none;
    }

    .code-collapse > .code-collapse__summary::-webkit-details-marker { display: none; }

    /* Disclosure triangle, rotates when open. */
    .code-collapse > .code-collapse__summary::before {
      content: '';
      flex: 0 0 auto;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 5px 0 5px 7px;
      border-color: transparent transparent transparent var(--ink-soft);
      transition: transform 160ms ease;
    }

    .code-collapse[open] > .code-collapse__summary::before { transform: rotate(90deg); }

    .code-collapse__lang {

      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-mute);

    .code-collapse__hint {

    }

    .code-collapse[open] .code-collapse__hint { display: none; }

    .code-collapse > .code-collapse__summary:hover .code-collapse__hint { color: var(--blueprint); }

    /* The wrapped <pre> already has its own margin/border; reset inside details.

       .code-collapse — a challenge should read as an invitation, not hide
       behind a generic "Show code" disclosure. The editor surface is a fixed
       dark panel (literal hex, not var(--...)) so it reads as a distinct
       code-execution surface — Codecademy/Scrimba-style — regardless of the
       page's own light/dark theme. */
    .fillin-block {
      margin: 20px 0;
      border: 1px solid var(--rule-soft);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-surface);
    }
    .fillin-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--rule-soft);
    }
    .fillin-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blueprint);
    }
    .fillin-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blueprint);
    }
    .fillin-actions { display: flex; gap: 6px; align-items: center; }
    .fillin-editor {
      display: flex;
      background: #05164d;
      overflow-x: auto;
    }
    .fillin-gutter {
      flex: 0 0 auto;
      padding: 14px 10px 14px 14px;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      line-height: 1.75;
      color: #3a5590;
      text-align: right;
      user-select: none;
    }
    /* Scoped with an extra ancestor class (not just `.fillin-pre`) so this
       beats the generic `.lesson-article pre` / `pre code` rules on
       specificity -- those are meant for plain code blocks, but since this
       is also a <pre>/<code> nested in .lesson-article, the generic rules
       were winning and flipping the editor to the light prose code style
       (wrong background, and clipped long lines instead of scrolling them).
       Scroll boundary lives on `code` itself -- same pattern as the plain
       `.lesson-article pre code` rule below -- not on the flex row, since a
       `overflow: visible` flex item doesn't register as scrollable overflow
       for an ancestor's `overflow-x: auto` (verified in-browser: content
       silently painted past the card instead of scrolling). */
    .fillin-block .fillin-pre {
      flex: 1;
      min-width: 0;
      margin: 0;
      border: none;
      background: transparent;
      overflow: hidden;
    }
    .fillin-block .fillin-pre code {
      display: block;
      padding: 14px 16px 14px 8px;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      line-height: 1.75;
      color: #c3d5ee;
      background: transparent;
      border: none;
      white-space: pre;
      overflow-x: auto;
    }
    .fillin-editor .syn-keyword { color: #7ba6dc; font-weight: 500; }
    .fillin-editor .syn-string { color: #a8d5b8; }
    .fillin-editor .syn-number { color: #7ba6dc; }
    .fillin-editor .syn-comment { color: #6f83ab; font-style: italic; }
    .fillin-input {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      color: #eaf1fb;
      background: rgba(123, 166, 220, 0.16);
      border: none;
      border-bottom: 2px solid #7ba6dc;
      padding: 0 4px;
      margin: 0 1px;
      min-width: 4em;
      border-radius: 2px 2px 0 0;
      outline: none;
    }
    .fillin-input::placeholder { color: #7ba6dc; opacity: 0.7; }
    .fillin-input:focus { background: #7ba6dc; color: #05164d; }
    .fillin-input.fillin-ok {
      color: #6fc79c;
      border-bottom-color: #6fc79c;
      background: rgba(111, 199, 156, 0.18);
    }
    .fillin-console {

      font-size: 0.66rem;
      letter-spacing: 0.1em;

    .artifact-disclosure {
      border: 1px solid var(--rule-soft);
      background: var(--bg);
      transition: border-color 0.15s, background 0.15s;
    }

    .artifact-disclosure[open] {
      border-color: var(--blueprint);
      background: var(--blueprint-tint);
    }

    .artifact-disclosure__summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      padding: 10px 14px;
      cursor: pointer;
      list-style: none;
    }

    .artifact-disclosure__summary::-webkit-details-marker { display: none; }

    .artifact-disclosure__summary::after,
    .artifact-chevron {
      content: '';
      width: 7px;
      height: 7px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      color: var(--ink-soft);
      transform: rotate(45deg);
      transition: transform 0.15s ease-out;
    }

    .artifact-disclosure[open] > .artifact-disclosure__summary::after,
    .inline-artifact-trigger[aria-expanded="true"] .artifact-chevron {
      transform: rotate(225deg);
    }

    .artifact-disclosure__summary:hover .output-card-name,
    .artifact-disclosure__summary:hover::after {
      color: var(--blueprint);
    }

    .artifact-disclosure__summary:focus-visible,
    .inline-artifact-trigger:focus-visible,
    .artifact-preview__copy:focus-visible {
      outline: 2px solid var(--blueprint);
      outline-offset: 3px;
    }

    .output-card-name {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      color: var(--ink);
      word-break: break-all;
      margin: 0;
      text-transform: none;
    }

    .output-badge {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 2px 8px;
      margin: 0;
      border: 1px solid var(--blueprint);
      color: var(--blueprint);
      background: var(--blueprint-tint);
    }

    .output-badge.prompt,
    .output-badge.skill,
    .output-badge.other {
      border-color: var(--blueprint);
      color: var(--blueprint);
      background: var(--blueprint-tint);
    }

    .artifact-disclosure__description {
      display: block;
      font-family: var(--font-body);
      font-size: 0.84rem;
      color: var(--ink-soft);
      line-height: 1.45;
      margin: 2px 0 0;
    }

    .inline-artifact-trigger {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      cursor: pointer;
      vertical-align: baseline;
    }

    .inline-artifact-trigger::before {
      content: '';
      position: absolute;
      inset: -8px -5px;
    }

    .inline-artifact-trigger code {
      color: var(--blueprint);
      text-decoration: none;
    }

    .artifact-chevron {
      display: inline-block;
      flex: 0 0 auto;
    }

    .artifact-preview {
      margin: 0 14px 14px;
      border: 1px solid var(--rule-soft);
      background: var(--code-bg);
    }

    .artifact-inline-preview {
      margin: 10px 0 20px;
    }

    .artifact-preview__bar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 40px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--rule-soft);
    }

    .artifact-preview__path {
      min-width: 0;
      flex: 1;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--ink-soft);
      word-break: break-all;
    }

    .artifact-preview__copy {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid var(--rule-soft);
      color: var(--ink-soft);
      background: transparent;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .artifact-preview__copy:hover {
      border-color: var(--blueprint);
      color: var(--blueprint);
    }

    .artifact-preview__status {
      padding: 14px;
      color: var(--ink-soft);
      font-family: var(--font-body);
      font-size: 0.9rem;
    }

    .artifact-preview__status.is-error { color: var(--error, #b42318); }

    .lesson-article .artifact-preview__pre {
      max-height: 36rem;
      margin: 0;
      overflow: auto;
      border: 0;
      border-radius: 0;
      background: var(--code-bg);
    }

    .lesson-article .artifact-preview__pre code {
      display: block;
      padding: 16px;
      white-space: pre;
      overflow-wrap: normal;
    }

    .code-output {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--ink);
      background: var(--blueprint-tint);
      border: 1px solid var(--rule-soft);
      padding: 12px 14px;
      margin: 0;
      max-height: 360px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .code-output-error {
      color: var(--status-error);
      border-color: var(--status-error);
      background: var(--status-error-bg);
    }

    .learning-timeline {
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      padding: 20px 4px 16px;
      position: relative;
    }

    .timeline-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 112px;
      flex-shrink: 0;
      position: relative;
      text-decoration: none;
      padding: 4px 6px;
    }

    .timeline-dot {
      width: 8px;
      height: 8px;
      background: transparent;
      border: 1px solid var(--rule);
      z-index: 2;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }

    .timeline-item.current .timeline-dot {
      width: 12px;
      height: 12px;
      background: var(--blueprint);
      border-color: var(--blueprint);
    }

    .timeline-item.prev .timeline-dot,
    .timeline-item.done .timeline-dot {
      background: var(--blueprint);
      border-color: var(--blueprint);
    }

    .timeline-line {
      width: 28px;
      height: 1px;
      background: var(--rule-soft);
      flex-shrink: 0;
      opacity: 0.7;
    }

    .timeline-line.done,
    .timeline-line.active {
      background: var(--blueprint);
      opacity: 1;

    .timeline-label {
      display: flex;

    .timeline-label-code {
      font-family: var(--font-mono);

    .timeline-label-name {
      font-family: var(--font-body);
      font-size: 0.82rem;
      color: var(--ink-soft);

    .timeline-item.current .timeline-label-code,

    }

    .timeline-item.current .timeline-label-name {
      font-weight: 500;
    }

    .timeline-ellipsis {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--ink-mute);
      letter-spacing: 0.04em;
      padding: 0 6px;
      white-space: nowrap;
    }


    .phase-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--rule-soft);
      overflow: hidden;
      margin: 14px 0 8px;
    }

    .phase-progress-fill {
      height: 100%;
      background: var(--blueprint);
      transition: width 0.5s ease;
    }

    .phase-progress-text {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      text-align: left;
    }

    .phase-complete-callout {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blueprint);
      text-align: center;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--blueprint);
      background: var(--blueprint-tint);
      display: none;
    }

    .phase-complete-callout.visible { display: block; }

    .continue-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }

    .phase-finished {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--blueprint);
      padding: 8px 16px;
    }

    .continue-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .continue-link {
      font-family: var(--font-body);
      font-size: 0.96rem;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .continue-link:hover {
      color: var(--blueprint);
      border-bottom-color: var(--blueprint);
    }

    .panel-loading {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-mute);
      text-align: center;
      padding: 20px;
    }

    .panel-fallback {
      text-align: left;
      padding: 16px 0;
    }

    .panel-fallback a {
      color: var(--blueprint);
      text-decoration: none;
      border-bottom: 1px solid var(--blueprint);
      font-family: var(--font-body);
      font-size: 0.95rem;
    }

    .toc-sidebar {
      position: fixed;
      top: 64px;
      right: 0;
      bottom: 0;
      width: 240px;
      background: transparent;
      overflow-y: auto;
      z-index: 40;
      padding: 56px 24px 80px;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: var(--rule-soft) transparent;
    }

    .toc-sidebar[aria-hidden="true"] { display: none; }

    .toc-sidebar::-webkit-scrollbar { width: 3px; }
    .toc-sidebar::-webkit-scrollbar-thumb { background: var(--rule-soft); }

    .toc-header {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--blueprint);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 18px;
    }

    .toc-nav {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      border-left: 1px solid var(--rule-soft);
    }

    .toc-item { line-height: 1.4; }

    .toc-link {
      font-family: var(--font-body);
      font-size: 0.84rem;
      color: var(--ink-soft);
      text-decoration: none;
      display: block;
      border-left: 2px solid transparent;
      padding: 5px 16px;
      margin-left: -1px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-h3 .toc-link {
      padding-left: 28px;
      font-size: 0.78rem;
    }

    .toc-link:hover {
      color: var(--ink);
      background: var(--blueprint-tint);
    }

    .toc-link:focus-visible {
      outline: 2px solid var(--blueprint);
      outline-offset: 2px;
    }

    .toc-link.active {
      color: var(--blueprint);
      border-left-color: var(--blueprint);
      font-weight: 500;
    }

    @media (min-width: 1280px) {
      .lesson-main { padding-right: 240px; }
      .toc-sidebar { display: block; }
    }

    @media (max-width: 1279px) {
      .lesson-main { padding-right: 32px; }
    }

    @media (min-width: 1440px) {
      .lesson-article { max-width: 900px; }
      .lesson-sidebar { width: 280px; min-width: 280px; }
      .lesson-main { margin-left: 280px; padding-right: 280px; }
      .toc-sidebar { width: 280px; }
    }

    @media (max-width: 900px) {
      .lesson-sidebar { transform: translateX(-100%); }
      .lesson-sidebar.open { transform: translateX(0); }
      .lesson-sidebar-toggle {
        display: flex;
        top: 70px;
        right: 12px;
        left: auto;
        width: 32px;
        height: 32px;
        font-size: 0.95rem;
      }
      .lesson-main { margin-left: 0; padding: 56px 20px 80px; }
    }

    @media (max-width: 768px) {
      .lesson-main { padding: 56px 16px 60px; }
      .lesson-article { max-width: 100%; }
      .lesson-article p,
      .lesson-article ul li,
      .lesson-article ol li { font-size: 1rem; line-height: 1.65; }
      .lesson-article > p:first-of-type::first-letter { font-size: 3rem; }
      .lesson-article pre code { font-size: 0.78rem; padding: 14px 14px; }
      .lesson-article table { font-size: 0.84rem; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .lesson-article table th,
      .lesson-article table td { padding: 8px 10px; white-space: nowrap; }
      .lesson-article .motto { font-size: 1.05rem; padding: 14px 16px; }
      .ai-panels { margin-top: 40px; gap: 28px; }
      .ai-panel { padding: 22px 16px; }
      .code-cards { grid-template-columns: 1fr; }
      .lesson-nav-bottom { flex-direction: column; gap: 12px; }
      .lesson-nav-btn { max-width: 100%; }
      .lesson-nav-btn.next { text-align: left; }
    }

    @media (max-width: 480px) {
      .lesson-article p,
      .lesson-article ul li,
      .lesson-article ol li { font-size: 0.96rem; }
      .lesson-article > p:first-of-type::first-letter { font-size: 2.6rem; }
      .ai-panel { padding: 18px 12px; }
      .timeline-item { min-width: 88px; }
      .timeline-line { width: 16px; }
      .timeline-label { max-width: 104px; }
      /* Tighten the header so logo + prev/next/overview + icons fit 320px. */
      .nav-edge { gap: 12px; }
      .lesson-headbar__nav { gap: 10px; }
      .nav-edge--lesson .notes-link,
      .nav-edge--lesson .badges-link { display: none; }
    }

    /* ── Lufthansa-calm alignment (lesson reader) ─────────────────────
       Override the terminal mechanics baked into the lesson-article rules
       so the reader matches the LRN cockpit it is launched from. */
    .lesson-article h1,
    .lesson-article h2,
    .lesson-article h3 {
      font-family: var(--font-display);
      text-transform: none;
      letter-spacing: -0.01em;
    }

    .lesson-article h1 {
      font-weight: var(--weight-medium);
      letter-spacing: -0.02em;
      line-height: 1.08;
      border-bottom: 1px solid var(--rule-soft);
      padding-bottom: 18px;
    }

    .lesson-article h2 {
      font-weight: var(--weight-medium);
      line-height: 1.15;
    }

    /* H3 was a tracked mono overline; make it a quiet medium-weight heading. */
    .lesson-article h3 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1.2rem;
      letter-spacing: -0.005em;
      text-transform: none;
    }

    .lesson-article h2.section-build,
    .lesson-article h2.section-use,
    .lesson-article h2.section-ship {
      border-left: 3px solid var(--blueprint);
    }

    /* No drop-cap in the calm editorial style. */
    .lesson-article > p:first-of-type::first-letter,
    .lesson-article .drop-cap::first-letter {
      float: none;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      padding: 0;
      color: inherit;
    }

    /* Hairline rule, not dashed ASCII bar. */
    .lesson-article hr {
      height: 1px;
      background-image: none;
      background-color: var(--rule-soft);
      margin: 40px 0;
    }

    /* Rounded code blocks + soft surfaces. */
    .lesson-article pre,
    .lesson-article code {
      border-radius: 6px;
    }
    .lesson-meta-tag { border-radius: 0; }
  </style>

  <script>
    // Shared by the mermaid init below and updateMermaidThemeAndRerender()
    // further down, so both configure mermaid identically. Colors and font
    // are resolved from the page's own design tokens (not mermaid's stock
    // theme palette) via getComputedStyle -- mermaid's color engine rejects
    // raw var(...) references, so these must be literal resolved values;
    // fontFamily is the one field mermaid just forwards into inline SVG
    // styles unparsed, so 'var(--font-text)' works there directly.
    function cssVar(name, fallback) {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    }
    window.cssVar = cssVar;
    function mermaidConfig() {
      return {
        startOnLoad: false,
        theme: 'base',
        fontFamily: 'var(--font-text)',
        themeVariables: {
          fontSize: '13px',
          background: cssVar('--bg-surface', '#ffffff'),
          primaryColor: cssVar('--bg-surface', '#ffffff'),
          primaryTextColor: cssVar('--ink', '#05164d'),
          primaryBorderColor: cssVar('--blueprint', '#05164d'),
          lineColor: cssVar('--ink-soft', '#52617c'),
          textColor: cssVar('--ink', '#05164d'),
          mainBkg: cssVar('--bg-surface', '#ffffff'),
          nodeBorder: cssVar('--blueprint', '#05164d'),
          clusterBkg: cssVar('--blueprint-tint', 'rgba(5, 22, 77, 0.06)'),
          clusterBorder: cssVar('--rule-soft', '#e3e1de'),
          edgeLabelBackground: cssVar('--bg-surface', '#ffffff'),
          tertiaryColor: cssVar('--blueprint-tint', 'rgba(5, 22, 77, 0.06)')
        },
        flowchart: {
          useMaxWidth: true,
          htmlLabels: true,
          nodeSpacing: 40,
          rankSpacing: 50,
          padding: 16,
          wrappingWidth: 200
        },
        // Node/cluster label height is occasionally under-computed by
        // mermaid's own layout pass for multi-line labels, which silently
        // clips the last line inside the foreignObject box. There's no
        // reliable per-diagram fix for the height math itself, so this
        // forces the overflow to stay visible rather than be cut off.
        themeCSS: 'foreignObject { overflow: visible !important; }'
      };
    }
    window.mermaidConfig = mermaidConfig;
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize(window.mermaidConfig());
    window._mermaidReady = mermaid;
  </script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var lessonPath = params.get('path');
      var lrnCourseId = params.get('course') || params.get('lrnCourse') || params.get('courseId');
      var lrnContext = null;
      // Language of the currently-rendered lesson content, derived from
      // whichever docs/<lang>.md the page actually fetched (see fetchLesson).
      // The article gets this language independently from the surrounding UI,
      // because a German UI may legitimately fall back to English content.
      var currentLessonLang = 'en';
      var requestedLessonLang = null;
      var lessonLoadSequence = 0;

      // Lesson content (docs/en.md, quiz.json, code/main.py, assets/*) is
      // gated server-side by the /api/content function — see api/content/
      // index.js. Local dev bypass: that's an Azure Function a plain static
      // server can't run, so on localhost fall back to fetching the same
      // files straight from site/phases/ (staged by serve.sh), same
      // precedent as the localhost bypass in gate-guard.js. Every other
      // hostname (any real deployment) always goes through /api/content.
      var IS_LOCAL_DEV = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
      function contentUrl(relPath) {
        return IS_LOCAL_DEV ? relPath : ('/api/content?path=' + encodeURIComponent(relPath));
      }

      if (!lessonPath) {
        showError('No lesson path specified', 'Add ?path=phases/01-math-foundations/01-linear-algebra-intuition to the URL.');
        return;
      }

      if (window.AIFSProgress) {
        window.AIFSProgress.recordVisit(lessonPath);
      }

      var phaseMatch = lessonPath.match(/phases\/(\d+-[^/]+)/);
      var lessonMatch = lessonPath.match(/phases\/\d+-[^/]+\/(\d+-[^/]+)/);
      var currentPhaseSlug = phaseMatch ? phaseMatch[1] : null;
      var currentLessonSlug = lessonMatch ? lessonMatch[1] : null;

      var currentPhaseIndex = -1;
      var currentLessonIndex = -1;
      var flatLessons = [];
      window.flatLessons = flatLessons;   // expose for not-found suggestions

      if (typeof PHASES !== 'undefined') {
        for (var i = 0; i < PHASES.length; i++) {
          var p = PHASES[i];
          var pSlug = extractPhaseSlug(p, i);
          for (var j = 0; j < p.lessons.length; j++) {
            var l = p.lessons[j];
            var lSlug = extractLessonSlug(l, j);
            flatLessons.push({
              phaseIndex: i,
              lessonIndex: j,
              phaseName: p.name,
              phaseId: p.id,
              phaseSlug: pSlug,
              phaseHidden: !!p.hidden,
              lessonName: l.name,
              lessonSlug: lSlug,
              status: l.status,
              type: l.type,
              lang: l.lang,
              url: l.url,
              path: 'phases/' + pSlug + '/' + lSlug,
              isReadable: l.status === 'complete' || !!l.url
            });
            if (pSlug === currentPhaseSlug && lSlug === currentLessonSlug) {
              currentPhaseIndex = i;
              currentLessonIndex = flatLessons.length - 1;
            }
          }
        }
      }

      // Phase scoped out of the catalog (hidden: true in data.js) — treat a
      // deep link into it the same as a not-found lesson, don't fetch/render.
      if (currentPhaseIndex >= 0 && PHASES[currentPhaseIndex].hidden) {
        showError('Lesson not found', 'This lesson is not part of the current catalog.', true);
        return;
      }

      lrnContext = buildLrnContext(lrnCourseId, lessonPath);
      if (lrnContext) {
        document.body.classList.add('lrn-lesson-mode');
      }

      buildSidebar();
      initSidebarToggle();
      initScrollProgress();

      // A course with exactly one lesson has no sibling lessons to navigate
      // between — the list-of-one sidebar is noise, not orientation. Hand
      // its width back to the content instead. The primer is the exception:
      // it has its own internal chapters, so it gets a real chapter-nav
      // sidebar instead (built below), not the hide treatment.
      if (lrnContext && lrnContext.total <= 1 && lessonPath !== 'llm-primer') {
        document.getElementById('lessonSidebar').classList.add('lesson-sidebar--hidden');
        document.querySelector('.lesson-main').classList.add('lesson-main--no-sidebar');
        var toggleBtn = document.getElementById('sidebarToggle');
        if (toggleBtn) toggleBtn.style.display = 'none';
      }

      // The primer isn't a markdown lesson in PHASES — it renders inside the
      // normal reading column (header/TOC chrome intact), just with an
      // <iframe> standing in for the fetched lesson body instead of markdown.
      // The sidebar becomes a live chapter list (its 16 mini-chapters), kept
      // in sync with the iframe via postMessage instead of full reloads.
      if (lessonPath === 'llm-primer') {
        document.querySelector('.lesson-main').classList.add('lesson-main--full');
        var primerFrame = document.createElement('iframe');
        primerFrame.src = '/llm-primer/index.html';
        primerFrame.style.cssText = 'border:none;width:100%;display:block;min-height:420px;';
        var contentEl = document.getElementById('lessonContent');
        contentEl.innerHTML = '';
        contentEl.appendChild(primerFrame);
        // Same-origin iframe with no scrolling of its own — size it to match
        // its actual content height so the page (not the widget) scrolls,
        // and re-measure whenever that content changes (chapter navigation
        // swaps the whole screen, so height changes on every step).
        primerFrame.addEventListener('load', function () {
          try {
            var doc = primerFrame.contentDocument;
            function resizeToContent() {
              var h = doc.documentElement.scrollHeight;
              if (h > 0) primerFrame.style.height = h + 'px';
            }
            resizeToContent();
            new ResizeObserver(resizeToContent).observe(doc.documentElement);
          } catch (e) { /* cross-origin or unavailable — keep min-height fallback */ }
        });

        // ---- Chapter-nav sidebar, kept in sync with the running iframe ----
        var primerChapters = null;
        var primerActive = null; // current chapter index, or null on cover/quiz/results
        var primerProgress = { completed: 0, total: 0 };

        function primerLangCookie() {
          var m = document.cookie.match('(?:^|; )lang=([^;]*)');
          var l = m ? decodeURIComponent(m[1]) : '';
          return (l === 'en' || l === 'de') ? l : 'en';
        }

        function renderPrimerSidebar() {
          var sidebar = document.getElementById('lessonSidebar');
          if (!sidebar || !primerChapters) return;
          var pct = primerProgress.total ? Math.round(primerProgress.completed / primerProgress.total * 100) : 0;
          var html = '<div class="lrn-sidebar-overview">' +
            '<a class="lrn-sidebar-back" href="index.html">&larr; Learning Catalog</a>' +
            '<div class="lrn-sidebar-title">Interactive LLM Primer</div>' +
            '<div class="lrn-sidebar-progress" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
            '<div class="lrn-sidebar-counter">' + primerProgress.completed + '/' + primerProgress.total + ' chapters done</div>' +
            '</div>';
          html += '<div class="lrn-sidebar-subcourse">';
          primerChapters.forEach(function (ch, i) {
            var active = i === primerActive;
            var done = ch.doneFlag;
            var iconName = done ? 'check-circle' : 'circle';
            html += '<a href="#" class="sidebar-lesson-link primer-chapter-link' + (active ? ' active' : '') + '" data-chapter="' + i + '"' + (active ? ' aria-current="page"' : '') + '>' +
              '<i class="ph-light ph-' + iconName + ' sidebar-lesson-icon ' + (done ? 'complete' : 'planned') + '" aria-hidden="true"></i>' +
              '<span class="lrn-sidebar-lesson-text"><span>' + escapeHtml(ch.title) + '</span></span>' +
              '</a>';
          });
          html += '</div>';
          sidebar.innerHTML = html;
          qa2(sidebar, '.primer-chapter-link').forEach(function (a) {
            a.addEventListener('click', function (e) {
              e.preventDefault();
              primerFrame.contentWindow.postMessage({ type: 'aifs-primer-goto', chapter: Number(a.getAttribute('data-chapter')) }, location.origin);
            });
          });
        }
        function qa2(root, sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); }

        // Language the sidebar titles were fetched for. The primer reports its
        // own language in every state message; switching it inside the iframe
        // used to leave English titles next to a German lesson until a full
        // page reload, because this fetch only ever ran once, at load.
        var primerTitlesLang = null;
        function loadPrimerTitles(lang) {
          if (lang === primerTitlesLang) return;
          primerTitlesLang = lang;
          fetch('/llm-primer/content/content.' + lang + '.json')
            .then(function (r) { return r.json(); })
            .then(function (data) {
              var prev = primerChapters || [];
              primerChapters = (data.chapters || []).map(function (c, i) {
                return { title: c.title, doneFlag: prev[i] ? prev[i].doneFlag : false };
              });
              primerProgress.total = primerChapters.length;
              renderPrimerSidebar();
            })
            .catch(function () { /* sidebar just stays on the loading state */ });
        }
        loadPrimerTitles(primerLangCookie());

        window.addEventListener('message', function (event) {
          if (event.origin !== location.origin || !event.data || event.data.type !== 'aifs-primer-state') return;
          var msg = event.data;
          if (msg.lang === 'en' || msg.lang === 'de') loadPrimerTitles(msg.lang);
          primerActive = (typeof msg.chapter === 'number') ? msg.chapter : null;
          primerProgress.completed = msg.completed || 0;
          if (msg.total) primerProgress.total = msg.total;
          if (primerChapters && Array.isArray(msg.doneChapters)) {
            primerChapters.forEach(function (ch, i) { ch.doneFlag = msg.doneChapters.indexOf(i) !== -1; });
          }
          renderPrimerSidebar();
          // The primer runs inside an iframe, so the normal quiz-section
          // completion check in maybeMarkLessonComplete() never fires for it
          // (it looks for .quiz-section in this document, not the iframe's).
          // msg.finished is the primer's own "reached the results screen
          // after the quiz" signal — the one point that actually means done.
          if (msg.finished && window.AIFSProgress && window.AIFSProgress.markLessonComplete) {
            window.AIFSProgress.markLessonComplete(lessonPath);
          }
        });

        return;
      }

      // Load the runnable-block manifest before rendering so code blocks can be
      // decorated with a Run button as they render. English is canonical;
      // selecting German opts into docs/de.md when that translation exists.
      var runnableManifestReady = loadRunnableManifest();
      function requestLessonContent() {
        var selected = window.SiteLang ? window.SiteLang.get() : 'en';
        var preferred = window.LessonLanguage.normalize(selected);
        if (preferred === requestedLessonLang) return;
        requestedLessonLang = preferred;
        var loadSequence = ++lessonLoadSequence;
        runnableManifestReady.then(function () {
          if (loadSequence === lessonLoadSequence) {
            fetchLesson(lessonPath, preferred, loadSequence);
          }
        });
      }
      document.addEventListener('sitelang:change', requestLessonContent);
      requestLessonContent();
      updateNotesNavCount();

      function extractPhaseSlug(phase, index) {
        if (phase.url) {
          var m = phase.url.match(/phases\/([^/]+)/);
          if (m) return m[1];
        }
        if (phase.lessons && phase.lessons.length > 0 && phase.lessons[0].url) {
          var m2 = phase.lessons[0].url.match(/phases\/([^/]+)/);
          if (m2) return m2[1];
        }
        return String(phase.id).padStart(2, '0') + '-' + phase.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      }

      function extractLessonSlug(lesson, index) {
        if (lesson.url) {
          var m = lesson.url.match(/phases\/[^/]+\/([^/]+)/);
          if (m) return m[1].replace(/\/$/, '');
        }
        return String(index + 1).padStart(2, '0') + '-' + lesson.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      }

      function buildLrnContext(courseId, path) {
        if (!courseId || !path || !window.LrnData || !window.LrnCurriculumMap) return null;
        // Rollout gate — see curriculum-map.js:visibleCourseIds. A hidden course
        // reached by hand-typed URL renders without LRN course chrome.
        var visibleCourseIds = window.LrnCurriculumMap.visibleCourseIds;
        if (visibleCourseIds && visibleCourseIds.length && visibleCourseIds.indexOf(courseId) === -1) return null;
        var course = null;
        for (var i = 0; i < window.LrnData.courses.length; i++) {
          if (window.LrnData.courses[i].id === courseId) {
            course = window.LrnData.courses[i];
            break;
          }
        }
        if (!course) return null;

        var groups = (window.LrnCurriculumMap.courseMaps && window.LrnCurriculumMap.courseMaps[course.id]) || [];
        if (!groups.length) return null;

        var lessons = [];
        groups.forEach(function (group, groupIndex) {
          group.lessons.forEach(function (lesson, lessonIndex) {
            lessons.push({
              path: lesson.path,
              title: lesson.title,
              groupTitle: group.title,
              groupIndex: groupIndex,
              lessonIndex: lessonIndex,
              decision: group.decision || 'core',
              note: group.note || ''
            });
          });
        });

        var currentIndex = -1;
        for (var j = 0; j < lessons.length; j++) {
          if (lessons[j].path === path) {
            currentIndex = j;
            break;
          }
        }
        if (currentIndex < 0) return null;

        var completed = 0;
        var visited = 0;
        lessons.forEach(function (lesson) {
          var state = lrnLessonProgressState(lesson.path);
          if (state === 'complete') completed++;
          if (state === 'complete' || state === 'in-progress') visited++;
        });

        return {
          course: course,
          groups: groups,
          lessons: lessons,
          currentIndex: currentIndex,
          current: lessons[currentIndex],
          prev: currentIndex > 0 ? lessons[currentIndex - 1] : null,
          next: currentIndex < lessons.length - 1 ? lessons[currentIndex + 1] : null,
          completed: completed,
          visited: visited,
          total: lessons.length,
          percent: lrnAveragePercent(lessons)
        };
      }

      function lrnLessonProgressState(path) {
        if (!window.AIFSProgress || !window.AIFSProgress.getLessonProgress) return 'planned';
        var progress = window.AIFSProgress.getLessonProgress(path);
        if (progress && progress.completedAt) return 'complete';
        if (progress && progress.visitedAt) return 'in-progress';
        return 'planned';
      }

      // Reading fraction (0..1) per lesson: completed counts fully, otherwise the
      // recorded scroll depth. Averaged across lessons it gives the partial unit
      // and course percentages shown in the sidebar and phase bar.
      function lrnReadFraction(path) {
        if (window.AIFSProgress && window.AIFSProgress.getReadFraction) {
          return window.AIFSProgress.getReadFraction(path);
        }
        return lrnLessonProgressState(path) === 'complete' ? 1 : 0;
      }

      function lrnAveragePercent(lessonList) {
        if (!lessonList.length) return 0;
        var sum = lessonList.reduce(function (acc, lesson) {
          return acc + lrnReadFraction(lesson.path);
        }, 0);
        return Math.round((sum / lessonList.length) * 100);
      }

      function lrnLessonHref(path) {
        var href = 'lesson.html?path=' + encodeURIComponent(path);
        if (lrnContext && lrnContext.course) {
          href += '&course=' + encodeURIComponent(lrnContext.course.id);
        }
        return href;
      }

      function lrnLessonOrdinal(index) {
        return lrnActivityCode(index) + '/' + String(lrnContext.total).padStart(2, '0');
      }

      function lrnUnitCode(index) {
        return 'U' + String(index + 1).padStart(2, '0');
      }

      function lrnActivityCode(index) {
        return 'A' + String(index + 1).padStart(2, '0');
      }

      function lrnDecisionLabel(decision) {
        if (decision === 'condense') return 'condensed';
        if (decision === 'optional') return 'optional';
        return 'core';
      }

      // Compress lesson titles for tight slots (course syllabus timeline).
      // Prefer the part before ":" or ",", drop filler words, cap at 4 tokens.
      // The full title stays in the link's title attribute.
      function lrnShortLabel(title) {
        if (!title) return '';
        var head = String(title).split(/\s*[,:]\s*/)[0];
        var stop = { the: 1, a: 1, an: 1, and: 1, of: 1, in: 1, on: 1, for: 1, to: 1, with: 1 };
        var words = head.split(/\s+/).filter(function (w) { return w && !stop[w.toLowerCase()]; });
        if (!words.length) words = head.split(/\s+/).filter(Boolean);
        return words.slice(0, 4).join(' ');
      }

      function lrnUnitProgress(group) {
        var completed = 0;
        var visited = 0;
        group.lessons.forEach(function (lesson) {
          var state = lrnLessonProgressState(lesson.path);
          if (state === 'complete') completed++;
          if (state === 'complete' || state === 'in-progress') visited++;
        });
        return {
          completed: completed,
          visited: visited,
          total: group.lessons.length,
          percent: lrnAveragePercent(group.lessons)
        };
      }

      // Map a lesson title to a Phosphor Light icon. First match wins; keep
      // specific topics (security, prompts, testing) before broad ones.
      // Falls back to a generic book icon.
      function lrnLessonIcon(title) {
        var t = String(title || "").toLowerCase();
        var rules = [
          [/security|injection|exploit|cve|vulnerab/, "shield-warning"],
          [/prompt/, "chats"],
          [/copilot|code review|claude code|cursor|mcp/, "code"],
          [/agent|workbench|tool use|function call/, "robot"],
          [/evaluat|test\b|qa\b|reviewer|verif|guard/, "test-tube"],
          [/architect|system design|pattern/, "tree-structure"],
          [/rag|knowledge|retrieval/, "database"],
          [/document|content|writing/, "file-text"],
          [/requirement|backlog|discovery/, "clipboard-text"],
          [/workflow|automation|process/, "flow-arrow"],
          [/responsible|trust|gdpr|ethics|legal|compliance/, "scales"],
          [/govern|risk|controls|audit/, "shield-check"]
        ];
        for (var i = 0; i < rules.length; i += 1) {
          if (rules[i][0].test(t)) return rules[i][1];
        }
        return "book-open";
      }

      function buildLrnSidebar(sidebar) {
        var html = '<div class="lrn-sidebar-overview">';
        html += '<a class="lrn-sidebar-back" href="index.html">&larr; Learning Catalog</a>';
        html += '<div class="lrn-sidebar-title">' + escapeHtml(lrnContext.course.title) + '</div>';
        html += '<div class="lrn-sidebar-progress" aria-hidden="true"><span style="width:' + lrnContext.percent + '%"></span></div>';
        html += '<div class="lrn-sidebar-counter">' + lrnContext.completed + '/' + lrnContext.total + ' tasks shipped</div>';
        html += '</div>';

        lrnContext.groups.forEach(function (group, groupIndex) {
          var unitProgress = lrnUnitProgress(group);
          html += '<div class="lrn-sidebar-subcourse">';
          html += '<div class="lrn-sidebar-subcourse-title">' + lrnUnitCode(groupIndex) + ' · ' + escapeHtml(group.title) + ' · ' + unitProgress.completed + '/' + unitProgress.total + '</div>';
          group.lessons.forEach(function (lesson) {
            var flatIndex = -1;
            for (var i = 0; i < lrnContext.lessons.length; i++) {
              if (lrnContext.lessons[i].path === lesson.path && lrnContext.lessons[i].groupIndex === groupIndex) {
                flatIndex = i;
                break;
              }
            }
            var active = lesson.path === lessonPath;
            var state = lrnLessonProgressState(lesson.path);
            var iconName = state === 'complete' ? 'check-circle' : lrnLessonIcon(lesson.title);
            html += '<a class="sidebar-lesson-link' + (active ? ' active' : '') + '" href="' + lrnLessonHref(lesson.path) + '"' + (active ? ' aria-current="page"' : '') + '>';
            html += '<i class="ph-light ph-' + iconName + ' sidebar-lesson-icon ' + state + '" aria-hidden="true"></i>';
            html += '<span class="lrn-sidebar-lesson-text">';
            html += '<span>' + escapeHtml(lesson.title) + '</span>';
            if (flatIndex >= 0) {
              html += '<span class="lrn-sidebar-lesson-meta">' + lrnActivityCode(flatIndex) + '</span>';
            }
            html += '</span>';
            html += '</a>';
          });
          html += '</div>';
        });

        sidebar.innerHTML = html;
      }

      function buildSidebar() {
        var sidebar = document.getElementById('lessonSidebar');
        if (!sidebar || typeof PHASES === 'undefined') return;

        if (lrnContext) {
          buildLrnSidebar(sidebar);
          return;
        }

        var html = '';

        // Step to the nearest non-hidden phase so prev/next never link into a
        // hidden phase. (A deep link straight into a hidden phase is already
        // caught above and shown as not-found, so this only guards navigation.)
        function adjacentVisiblePhaseIdx(start, dir) {
          for (var k = start + dir; k >= 0 && k < PHASES.length; k += dir) {
            if (!PHASES[k].hidden) return k;
          }
          return -1;
        }
        var prevPhaseIdx = currentPhaseIndex > 0 ? adjacentVisiblePhaseIdx(currentPhaseIndex, -1) : -1;
        var nextPhaseIdx = (currentPhaseIndex >= 0 && currentPhaseIndex < PHASES.length - 1) ? adjacentVisiblePhaseIdx(currentPhaseIndex, 1) : -1;

        if (prevPhaseIdx >= 0 || nextPhaseIdx >= 0) {
          html += '<div class="sidebar-phase-nav">';
          if (prevPhaseIdx >= 0) {
            var pp = PHASES[prevPhaseIdx];
            var ppSlug = extractPhaseSlug(pp, prevPhaseIdx);
            var ppFirstLesson = pp.lessons[0] ? extractLessonSlug(pp.lessons[0], 0) : '';
            html += '<a href="lesson.html?path=phases/' + ppSlug + '/' + ppFirstLesson + '">&larr; Phase ' + String(pp.id).padStart(2, '0') + ': ' + escapeHtml(pp.name) + '</a>';
          }
          if (nextPhaseIdx >= 0) {
            var np = PHASES[nextPhaseIdx];
            var npSlug = extractPhaseSlug(np, nextPhaseIdx);
            var npFirstLesson = np.lessons[0] ? extractLessonSlug(np.lessons[0], 0) : '';
            html += '<a href="lesson.html?path=phases/' + npSlug + '/' + npFirstLesson + '">Phase ' + String(np.id).padStart(2, '0') + ': ' + escapeHtml(np.name) + ' &rarr;</a>';
          }
          html += '</div>';
        }

        if (currentPhaseIndex >= 0) {
          var phase = PHASES[currentPhaseIndex];
          html += '<div class="sidebar-phase-header">Phase ' + String(phase.id).padStart(2, '0') + ' · ' + escapeHtml(phase.name) + '</div>';
          for (var k = 0; k < phase.lessons.length; k++) {
            var les = phase.lessons[k];
            var lesSlug = extractLessonSlug(les, k);
            var pSlugCurrent = extractPhaseSlug(phase, currentPhaseIndex);
            var isActive = lesSlug === currentLessonSlug;
            var lesReadable = les.status === 'complete' || !!les.url;
            if (lesReadable) {
              html += '<a class="sidebar-lesson-link' + (isActive ? ' active' : '') + '" href="lesson.html?path=phases/' + pSlugCurrent + '/' + lesSlug + '">';
            } else {
              html += '<span class="sidebar-lesson-link disabled">';
            }
            html += '<span class="sidebar-lesson-dot ' + les.status + '"></span>';
            html += escapeHtml(les.name);
            html += lesReadable ? '</a>' : '</span>';
          }
        }

        sidebar.innerHTML = html;
      }

      function initSidebarToggle() {
        var toggle = document.getElementById('sidebarToggle');
        var sidebar = document.getElementById('lessonSidebar');
        if (!toggle || !sidebar) return;

        toggle.addEventListener('click', function () {
          sidebar.classList.toggle('open');
        });

        document.addEventListener('click', function (e) {
          if (window.innerWidth <= 900 && sidebar.classList.contains('open')) {
            if (!sidebar.contains(e.target) && e.target !== toggle) {
              sidebar.classList.remove('open');
            }
          }
        });
      }

      function initScrollProgress() {
        var bar = document.getElementById('scrollProgress');
        if (!bar) return;
        var maxFraction = 0;   // deepest scroll reached this session
        var saveTimer = null;

        function persist() {
          saveTimer = null;
          if (lessonPath && window.AIFSProgress && window.AIFSProgress.recordReadProgress) {
            window.AIFSProgress.recordReadProgress(lessonPath, maxFraction);
          }
        }

        window.addEventListener('scroll', function () {
          var scrollTop = window.scrollY || document.documentElement.scrollTop;
          var docHeight = document.documentElement.scrollHeight - window.innerHeight;
          var fraction = docHeight > 0 ? (scrollTop / docHeight) : 0;
          bar.style.width = (fraction * 100) + '%';
          // Track the high-water mark and persist it, throttled, so the
          // course/syllabus percentages reflect partial reading automatically.
          if (fraction > maxFraction) {
            maxFraction = fraction;
            if (!saveTimer) saveTimer = setTimeout(persist, 800);
          }
        }, { passive: true });

        // Flush the latest depth when the user leaves the page mid-scroll.
        window.addEventListener('pagehide', persist);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') persist();
        });
      }

      function fetchLesson(path, preferredLang, loadSequence) {
        // Load lesson content through the gated /api/content function (see
        // contentUrl() above), not from GitHub and not from a static site
        // path. `path` is "phases/<phase>/<lesson>". The selected UI language
        // determines the candidate order: EN loads docs/en.md only; DE tries
        // docs/de.md and falls back to the required English variant.
        var quizUrl = path + '/quiz.json';

        window.LessonLanguage.load(path, preferredLang, function (contentPath) {
          return fetch(contentUrl(contentPath));
        })
          .then(function (loaded) {
            if (loadSequence !== lessonLoadSequence) return;
            currentLessonLang = loaded.lang;
            try {
              renderLesson(loaded.text);
            } catch (err) {
              console.error('renderLesson failed', err);
              showError('Render error', 'Loaded the lesson markdown but failed to render it. Details in the browser console.');
              return;
            }
            fetch(contentUrl(quizUrl))
              .then(function (res) { return res.ok ? res.json() : null; })
              .catch(function () { return null; })
              .then(function (data) {
                if (loadSequence !== lessonLoadSequence) return;
                if (!data) return;
                try { renderQuiz(data); }
                catch (err) { console.error('renderQuiz failed', err); }
              });
          })
          .catch(function () {
            if (loadSequence !== lessonLoadSequence) return;
            var suggestion = suggestLesson(path);
            var msg = 'Could not fetch the lesson at <code>' + escapeHtml(path) + '</code>.';
            if (suggestion) {
              msg += ' Did you mean <a href="' + (lrnContext ? lrnLessonHref(suggestion.path) : 'lesson.html?path=' + encodeURIComponent(suggestion.path)) + '">'
                + escapeHtml(suggestion.lessonName || suggestion.path) + '</a>? '
                + '(The link may have been cut off.)';
            } else {
              msg += ' It may not have been written yet, or the link was cut off.';
            }
            showError('Lesson not found', msg, true);
          });
      }

      // Find the closest real lesson to a possibly-truncated/typo'd path.
      // Prefix match first (covers cut-off links like ".../01-the-"),
      // then a loose contains/overlap fallback.
      function suggestLesson(path) {
        var lessons = window.flatLessons || [];
        if (!lessons.length || !path) return null;
        var p = String(path).replace(/\/+$/, '');
        // exact prefix: the typed path is the start of a real lesson path
        for (var i = 0; i < lessons.length; i++) {
          if (lessons[i].path && lessons[i].path.indexOf(p) === 0) return lessons[i];
        }
        // same phase + lesson-slug prefix
        var lastSeg = p.split('/').pop();
        var phasePart = p.split('/').slice(0, 2).join('/');
        var best = null, bestScore = 0;
        for (var j = 0; j < lessons.length; j++) {
          var lp = lessons[j].path || '';
          var score = 0;
          if (lp.indexOf(phasePart) === 0) score += 2;          // same phase
          if (lastSeg && lp.indexOf(lastSeg) !== -1) score += 2; // slug overlap
          if (score > bestScore) { bestScore = score; best = lessons[j]; }
        }
        return bestScore >= 2 ? best : null;
      }

      function showError(title, msg, _showCatalog) {
        var el = document.getElementById('lessonContent');
        // Cut #59: "Browse all lessons" duplicate button dropped; showCatalog kept
        // for call-site compat but no longer renders a second action.
        var actions = '<a href="index.html" class="btn btn-primary">' + (lrnContext ? 'Back to catalog' : 'Back to Home') + '</a>';
        el.innerHTML = '<div class="lesson-error"><h2>' + title + '</h2><p>' + msg + '</p>' + actions + '</div>';
      }

      function lessonDescription(md) {
        var lines = md.split(/\r?\n/);
        for (var i = 0; i < lines.length; i++) {
          var t = lines[i].trim();
          if (t.indexOf('>') === 0) return t.replace(/^>\s*/, '').replace(/[*_`]/g, '').slice(0, 200);
        }
        for (var j = 0; j < lines.length; j++) {
          var p = lines[j].trim();
          if (p && p[0] !== '#' && p[0] !== '>' && p[0] !== '|' && p[0] !== '`' && p.indexOf('**') !== 0) {
            return p.replace(/[*_`]/g, '').slice(0, 200);
          }
        }
        return '504 lessons across 15 phases from Lufthansa Industry Solutions. Every algorithm implemented from first principles.';
      }

      // Client-side per-lesson SEO. Robust indexing comes with build-time
      // prerender (next PR); this covers JS-executing crawlers + correct tabs.
      function updateLessonSeo(title, md) {
        var ORIGIN = 'https://aiengineeringfromscratch.com';

        var url = ORIGIN + '/lesson.html?path=' + path;

        var desc = lessonDescription(md);

        var set = function (sel, val) { var m = document.querySelector(sel); if (m) m.setAttribute('content', val); };

        var canon = document.querySelector('link[rel="canonical"]');
        if (canon) canon.setAttribute('href', url);
        set('meta[name="description"]', desc);
        set('meta[property="og:title"]', fullTitle);
        set('meta[property="og:description"]', desc);
        set('meta[name="twitter:title"]', fullTitle);
        set('meta[name="twitter:description"]', desc);
        var ogu = document.querySelector('meta[property="og:url"]');
        if (!ogu) { ogu = document.createElement('meta'); ogu.setAttribute('property', 'og:url'); document.head.appendChild(ogu); }
        ogu.setAttribute('content', url);

        var prev = document.getElementById('lessonJsonLd');
        if (prev) prev.remove();
        var ld = {
          '@context': 'https://schema.org',

              inLanguage: currentLessonLang, isAccessibleForFree: true,

            { '@type': 'BreadcrumbList', itemListElement: [

      // Lucide icons (inline SVG) used in rendered lesson headings, in place of
      // emojis. currentColor + 1em so they inherit the heading's color and size.
      var LUCIDE_SVG_ATTRS = 'viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.12em;margin-right:.35em"';
      var LUCIDE_TARGET = '<svg ' + LUCIDE_SVG_ATTRS + '><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>';
      var LUCIDE_FLASK = '<svg ' + LUCIDE_SVG_ATTRS + '><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/></svg>';
      var LUCIDE_CHECK_CIRCLE = '<svg ' + LUCIDE_SVG_ATTRS + '><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>';
      // Standalone panel-icon variant: no inline margin, since it sits alone

      var LUCIDE_ARROW_RIGHT_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';

      function renderLesson(md) {
        var el = document.getElementById('lessonContent');
        var html = '';
        // LRN context now lives in the page header (nav-edge), not as a card
        // above the lesson body. Fill the header slot instead of the content.
        renderLessonHeaderContext();

        html += '<div class="ai-panels" id="aiPanels"></div>';
        html = addBottomNav(html);
        // D5: tag the content container with the language actually loaded
        // (currentLessonLang, set in fetchLesson) rather than inheriting the
        // page's <html lang>, which is fixed and may not match the content.
        el.innerHTML = '<article class="lesson-article" lang="' + currentLessonLang + '">' + html + '</article>';

        document.title = extractTitle(md) + (lrnContext ? ' · ' + lrnContext.course.id + ' LRN' : ' - LHIND AI Learning Catalog');
        updateLessonSeo(extractTitle(md), md);

        initCodeCopy();
        initGlossTooltips();

        document.querySelectorAll('a[href^="#"]').forEach(function (link) {
          link.addEventListener('click', function (e) {

            // progressive-enhancement placeholder, not a fragment target.

            if (target) {

      // Fill the page header (nav-edge) with the LRN course context, grouped on
      // the right: breadcrumb + course title stacked, nav controls beside them.
      // The settings gear is always present (even outside LRN) so the key dialog
      // stays reachable on every lesson.
      function renderLessonHeaderContext() {
        var slot = document.getElementById('lessonHeaderContext');
        if (!slot) return;

        var nav = '<nav class="lesson-headbar__nav" aria-label="Lesson navigation">';
        if (lrnContext && lrnContext.prev) {
          nav += '<a href="' + lrnLessonHref(lrnContext.prev.path) + '" title="Previous activity" aria-label="Previous activity">&larr;</a>';
        }

        nav += '<a href="' + overviewHref + '" data-i18n="nav_overview">Overview</a>';

          nav += '<a href="' + lrnLessonHref(lrnContext.next.path) + '" title="Next activity" aria-label="Next activity">&rarr;</a>';
        }
        nav += '<button type="button" id="darkModeToggle" class="nav-settings theme-toggle" title="Switch color theme" aria-label="Switch color theme"><i class="ph-light ph-moon" aria-hidden="true" id="darkModeIcon"></i></button>';
        nav += '<a href="#" id="langToggle" class="lang-toggle theme-toggle" title="Switch language" aria-label="Switch language" data-i18n-title="lang_toggle_title"><span id="langIcon" class="theme-icon">EN</span></a>';

      // D1 — dark-mode toggle. The header (including this button) is
      // rebuilt on every lesson render via renderLessonHeaderContext(), so
      // the click handler is delegated on document (same pattern lang.js
      // already uses for #langToggle) instead of bound once to an element
      // that gets replaced. syncDarkModeToggle() re-applies the current
      // icon/label each time the header is rebuilt.
      function darkModeStored() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
      function darkModeOsDark() { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
      function darkModeCurrent() {
        var s = darkModeStored();
        return (s === 'dark' || s === 'light') ? s : (darkModeOsDark() ? 'dark' : 'light');
      }
      function syncDarkModeToggle() {
        var btn = document.getElementById('darkModeToggle');
        var icon = document.getElementById('darkModeIcon');
        if (!btn || !icon) return;
        var theme = darkModeCurrent();
        icon.className = 'ph-light ' + (theme === 'dark' ? 'ph-sun' : 'ph-moon');
        var de = (window.SiteLang ? window.SiteLang.get() : 'en') === 'de';
        var label = theme === 'dark'
          ? (de ? 'Zu hellem Farbschema wechseln' : 'Switch to light color theme')
          : (de ? 'Zu dunklem Farbschema wechseln' : 'Switch to dark color theme');
        btn.title = label;
        btn.setAttribute('aria-label', label);
        btn.setAttribute('aria-pressed', String(theme === 'dark'));
      }
      document.addEventListener('click', function (e) {
        var btn = e.target.closest && e.target.closest('#darkModeToggle');
        if (!btn) return;
        var next = darkModeCurrent() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (err) {}
        document.documentElement.setAttribute('data-theme', next);
        syncDarkModeToggle();
      });
      document.addEventListener('sitelang:change', syncDarkModeToggle);

      function buildTOC() {
        var sidebar = document.getElementById('tocSidebar');
        if (!sidebar) return;

        var article = document.querySelector('.lesson-article');
        if (!article) {
          sidebar.innerHTML = '';
          sidebar.removeAttribute('aria-hidden');
          return;
        }

        var headings = article.querySelectorAll('h2, h3');
        if (!headings.length) {
          sidebar.innerHTML = '';
          sidebar.removeAttribute('aria-hidden');
          return;
        }

        var used = Object.create(null);

        function ensureHeadingId(heading, idx) {
          if (!heading) return '';

          var base = '';
          if (heading.id) {
            base = heading.id;
          } else if (typeof slugify === 'function') {
            base = slugify(heading.textContent || '');
          } else {
            base = String(heading.textContent || '').toLowerCase().trim().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
          }
          if (!base) base = 'section-' + String(idx + 1);

          var candidate = base;
          var n = 2;

          while (used[candidate] || (document.getElementById(candidate) && document.getElementById(candidate) !== heading)) {
            candidate = base + '-' + n;
            n++;
          }
          
          used[candidate] = true;
          heading.id = candidate;
          return candidate;
        }

        var html = '<div class="toc-header">On this page</div>';
        html += '<nav aria-label="On this page"><ul class="toc-nav">';
        for (var i = 0; i < headings.length; i++) {
          var heading = headings[i];
          var level = heading.tagName.toLowerCase();
          var id = ensureHeadingId(heading, i);
          if (!id) continue;
          var fullText = (heading.textContent || '').trim();
          var text = fullText.replace(/^[^\p{L}\p{N}]+/u, '').trim();
          if (!text) continue;
          html += '<li class="toc-item toc-' + level + '"><a href="#' + id + '" class="toc-link" data-toc-id="' + id + '" title="' + escapeHtml(fullText) + '">' + escapeHtml(text) + '</a></li>';
        }
        html += '</ul></nav>';
        sidebar.innerHTML = html;
        sidebar.removeAttribute('aria-hidden');

        sidebar.querySelectorAll('.toc-link').forEach(function (a) {
          a.addEventListener('click', function (e) {
            var href = a.getAttribute('href');
            if (!href || href.charAt(0) !== '#') return;
            var id = href.slice(1);
            var target = document.getElementById(id);
            if (!target) return;
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', '#' + id);
            if (!target.hasAttribute('tabindex')) {
              target.setAttribute('tabindex', '-1');
              target.addEventListener('blur', function blurHandler() {
                target.removeAttribute('tabindex');
                target.removeEventListener('blur', blurHandler);
              });
            }
            target.focus({ preventScroll: true });
          });
        });

        initScrollspy(headings, sidebar);
      }

      function initScrollspy(headings, sidebar) {
        sidebar = sidebar || document.getElementById('tocSidebar');
        if (!sidebar) return;

        var links = sidebar.querySelectorAll('.toc-link');
        if (!links.length || !headings || !headings.length) return;

        var headerOffsetStr = getComputedStyle(document.documentElement).getPropertyValue('--header-offset').trim();
        var headerOffset = parseInt(headerOffsetStr, 10) || 92;

        if (sidebar._tocObserver && sidebar._tocObserver.disconnect) {
          sidebar._tocObserver.disconnect();
          sidebar._tocObserver = null;
        }
        if (sidebar._tocScrollHandler) {
          window.removeEventListener('scroll', sidebar._tocScrollHandler);
          sidebar._tocScrollHandler = null;
        }
        if (sidebar._tocResizeHandler) {
          window.removeEventListener('resize', sidebar._tocResizeHandler);
          sidebar._tocResizeHandler = null;
        }

        function setActive(id) {
          if (!id || sidebar._tocActiveId === id) return;
          sidebar._tocActiveId = id;

          links.forEach(function (link) {
            var href = link.getAttribute('href');
            var match = href && href.charAt(0) === '#' ? href.slice(1) : '';
            if (match === id) link.classList.add('active');
            else link.classList.remove('active');
          });

          var activeLink = sidebar.querySelector('.toc-link.active');
          if (activeLink) {
            var linkTop = activeLink.offsetTop;
            var sidebarHeight = sidebar.clientHeight;
            var sidebarScroll = sidebar.scrollTop;
            if (linkTop < sidebarScroll + 50 || linkTop > sidebarScroll + sidebarHeight - 100) {
              sidebar.scrollTo({ top: Math.max(0, linkTop - sidebarHeight / 3), behavior: 'smooth' });
            }
          }
        }

        function fallbackByScroll() {
          var y = (window.scrollY || document.documentElement.scrollTop || 0) + headerOffset + 18;
          var active = '';
          for (var i = 0; i < headings.length; i++) {
            var h = headings[i];
            if (!h || !h.id) continue;
            var top = h.getBoundingClientRect().top + window.scrollY;
            if (top <= y) active = h.id;
            else break;
          }
          if (!active && headings[0] && headings[0].id) active = headings[0].id;
          if (active) setActive(active);
        }

        if (typeof IntersectionObserver !== 'undefined') {
          var marginOffset = headerOffset - 4;
          var obs = new IntersectionObserver(function (entries) {
            var best = null;
            for (var i = 0; i < entries.length; i++) {
              var e = entries[i];
              if (!e.isIntersecting) continue;
              if (!best) best = e;
              else if (e.boundingClientRect.top < best.boundingClientRect.top) best = e;
            }
            if (best && best.target && best.target.id) setActive(best.target.id);
          }, {
            root: null,
            threshold: [0.01, 0.1],
            rootMargin: '-' + marginOffset + 'px 0px -70% 0px'
          });

          Array.from(headings).forEach(function (h) {
            if (h && h.id) obs.observe(h);
          });
          sidebar._tocObserver = obs;

          var initial = (location.hash && location.hash.charAt(0) === '#') ? location.hash.slice(1) : '';
          if (initial && document.getElementById(initial)) setActive(initial);
          else if (headings[0] && headings[0].id) setActive(headings[0].id);

          return;
        }

        sidebar._tocScrollHandler = function () {
          if (window._tocTicking) return;
          window._tocTicking = true;
          window.requestAnimationFrame(function () {
            fallbackByScroll();
            window._tocTicking = false;
          });
        };
        window.addEventListener('scroll', sidebar._tocScrollHandler, { passive: true });

        sidebar._tocResizeHandler = function () {
          fallbackByScroll();
        };
        window.addEventListener('resize', sidebar._tocResizeHandler);

        fallbackByScroll();
      }

      function extractTitle(md) {
        var m = md.match(/^# (.+)/m);
        return m ? m[1] : 'Lesson';
      }

      function parseMd(md) {
        resetGlossaryState();
        _artifactPreviewSeq = 0;
        var lines = md.split(/\r?\n/);
        var out = '';
        var inCodeBlock = false;
        var codeLang = '';
        var codeEditable = false;
        var codeFillin = false;
        var codeLines = [];
        var inTable = false;
        var tableRows = [];
        var inList = false;
        var listType = '';
        var listItems = [];
        var firstBlockquoteDone = false;
        var firstParaAfterMottoDone = false;
        var inBlockquote = false;
        var blockquoteLines = [];
        var mermaidBlocks = 0;
        var inLabChallenge = false;
        var inMeta = false;

        function flushMeta() {
          if (!inMeta) return '';
          inMeta = false;
          return '</dl>';
        }

        function flushLabChallenge() {
          if (!inLabChallenge) return '';
          inLabChallenge = false;
          return '</div>';
        }

        function flushList() {
          if (!inList) return '';
          inList = false;
          var tag = listType === 'ol' ? 'ol' : 'ul';
          var h = '<' + tag + '>';
          for (var li = 0; li < listItems.length; li++) {
            h += '<li>' + inlineFormat(listItems[li]) + '</li>';
          }
          h += '</' + tag + '>';
          listItems = [];
          return h;
        }

        function flushTable() {
          if (!inTable) return '';
          inTable = false;
          if (tableRows.length < 2) return '';
          var headers = tableRows[0];
          var isKeyTerms = false;
          for (var th = 0; th < headers.length; th++) {
            if (headers[th].toLowerCase().indexOf('what people say') >= 0 || headers[th].toLowerCase().indexOf('people say') >= 0) {
              isKeyTerms = true;
            }
          }
          var h = '<div class="table-wrap' + (isKeyTerms ? ' key-terms-table' : '') + '"><table><thead><tr>';
          for (var ti = 0; ti < headers.length; ti++) {
            h += '<th>' + inlineFormat(headers[ti].trim()) + '</th>';
          }
          h += '</tr></thead><tbody>';
          for (var ri = 2; ri < tableRows.length; ri++) {
            var cells = tableRows[ri];
            h += '<tr>';
            for (var ci = 0; ci < headers.length; ci++) {
              var cls = '';
              if (isKeyTerms) {
                var headerLower = (headers[ci] || '').toLowerCase();
                if (headerLower.indexOf('say') >= 0) cls = ' class="col-says"';
              }
              h += '<td' + cls + '>' + inlineFormat((cells[ci] || '').trim()) + '</td>';
            }
            h += '</tr>';
          }
          h += '</tbody></table></div>';
          if (isKeyTerms) {
            var savedTerms = [];
            for (var sri = 2; sri < tableRows.length; sri++) {
              var scells = tableRows[sri];
              savedTerms.push({
                term: (scells[0] || '').trim(),
                says: (scells[1] || '').trim(),
                means: (scells[2] || '').trim()
              });
            }
            h += '<div class="key-terms-save" data-key-terms="' + escapeAttr(JSON.stringify(savedTerms)) + '">' +
              '<button type="button" class="btn key-terms-save-btn" id="keyTermsSaveBtn">Save to My Merkzettel</button>' +
              '</div>';
          }
          tableRows = [];
          return h;
        }

        function flushBlockquote() {
          if (!inBlockquote) return '';
          inBlockquote = false;
          var text = blockquoteLines.join(' ');
          blockquoteLines = [];
          if (!firstBlockquoteDone) {
            firstBlockquoteDone = true;
            return '<div class="motto">' + inlineFormat(text) + '</div>';
          }
          return '<blockquote><p>' + inlineFormat(text) + '</p></blockquote>';
        }

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];

          // Close an open metadata strip once a non-meta, non-blank block
          // begins (code fence, list, table, etc.), so it can't swallow them.
          if (inMeta && !inCodeBlock && line.trim() !== '' &&
              !line.match(/^\*\*/)) {
            out += flushMeta();
          }

          if (inCodeBlock) {
            if (line.match(/^```\s*$/)) {
              inCodeBlock = false;
              var raw = codeLines.join('\n');
              if (codeLang === 'figure') {
                out += '<div class="lesson-figure" data-figure="' + escapeHtml(raw.trim()) + '"></div>';
              } else if (codeLang === 'mermaid') {
                mermaidBlocks++;
                out += '<div class="mermaid-container">';
                out += '<div class="mermaid-block" data-mermaid-index="' + mermaidBlocks + '">';
                out += '<div class="mermaid-toolbar">';
                out += '<button type="button" class="mermaid-btn mermaid-expand" data-mermaid-index="' + mermaidBlocks + '">Expand</button>';
                out += '</div>';
                out += '<pre class="mermaid mermaid-source" id="mermaid-' + mermaidBlocks + '">' + escapeHtml(raw) + '</pre>';
                out += '<div class="mermaid-render" id="mermaid-render-' + mermaidBlocks + '"></div>';
                out += '</div>';
                out += '</div>';
              } else {
                out += renderCodeBlock(raw, codeLang, codeEditable, codeFillin);
              }
              codeLines = [];
              codeLang = '';
              codeEditable = false;
              codeFillin = false;
            } else {
              codeLines.push(line);
            }
            continue;
          }

          var codeStart = line.match(/^```(\w*)(.*)$/);
          if (codeStart) {
            out += flushList();
            out += flushTable();
            out += flushBlockquote();
            inCodeBlock = true;
            codeLang = codeStart[1] || '';

        var keywords, commentPattern;

        if (lang === 'python' || lang === 'py') {
          keywords = /\b(def|class|return|if|elif|else|for|while|in|import|from|as|with|try|except|finally|raise|yield|lambda|not|and|or|is|None|True|False|print|self|pass|break|continue|assert|global)\b/g;
          commentPattern = /(#[^\n]*)/g;
        } else if (lang === 'julia') {
          keywords = /\b(function|end|if|elseif|else|for|while|in|using|import|return|struct|mutable|abstract|type|module|export|let|const|begin|do|try|catch|finally|throw|true|false|nothing|println)\b/g;
          commentPattern = /(#[^\n]*)/g;
        } else if (lang === 'javascript' || lang === 'js' || lang === 'typescript' || lang === 'ts') {
          keywords = /\b(function|const|let|var|return|if|else|for|while|class|new|this|import|export|from|async|await|try|catch|throw|typeof|instanceof|true|false|null|undefined|console)\b/g;
          commentPattern = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g;
        } else if (lang === 'rust') {
          keywords = /\b(fn|let|mut|struct|enum|impl|trait|pub|use|mod|self|super|crate|return|if|else|for|while|loop|match|async|await|true|false|None|Some|Ok|Err|println)\b/g;
          commentPattern = /(\/\/[^\n]*)/g;
        } else {
          keywords = /\b(function|def|class|return|if|else|for|while|import|from|const|let|var|true|false|null|None|print|println)\b/g;
          commentPattern = /(#[^\n]*|\/\/[^\n]*)/g;
        }

        var tokens = [];
        function stash(match) {
          var id = '\x00TOK' + tokens.length + '\x00';
          tokens.push(match);
          return id;
        }

        code = code.replace(commentPattern, function (m) { return stash('<span class="syn-comment">' + m + '</span>'); });
        code = code.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;|&#39;(?:[^&]|&(?!#39;))*?&#39;|&quot;&quot;&quot;[\s\S]*?&quot;&quot;&quot;)/g, function (m) { return stash('<span class="syn-string">' + m + '</span>'); });
        code = code.replace(/"([^"]*?)"/g, function (m) { return stash('<span class="syn-string">' + m + '</span>'); });

        code = code.replace(keywords, '<span class="syn-keyword">$1</span>');
        code = code.replace(/\b(\d+\.?\d*)\b/g, '<span class="syn-number">$1</span>');

        for (var ti = 0; ti < tokens.length; ti++) {
          code = code.replace('\x00TOK' + ti + '\x00', tokens[ti]);
        }
        return code;
      }
