<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="title_gate">Enter passcode · AI Learning Catalog</title>
  <meta name="robots" content="noindex">
  <style>
    html, body { margin: 0; height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(120% 90% at 50% -20%, rgba(90,138,201,0.35) 0%, transparent 60%),
        linear-gradient(180deg, #14366B 0%, #05164d 100%);
      font-family: "Lufthansa Text", "Helvetica Neue", Arial, sans-serif;
      font-weight: 400; color: #ffffff;
    }
    .box { width: min(420px, 86vw); text-align: center; }
    .title {
      font-family: "Lufthansa Head", "Helvetica Neue", Arial, sans-serif;
      font-weight: 500; font-size: 1.5rem; letter-spacing: -0.01em;
      line-height: 1.2; margin-bottom: 8px;
    }
    .over {
      font-weight: 500; font-size: 0.72rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(255,255,255,0.72); margin-bottom: 28px;
    }
    .msg { font-size: 0.95rem; line-height: 1.6; color: rgba(255,255,255,0.88); margin-bottom: 24px; }
    form { display: flex; flex-direction: column; gap: 14px; align-items: center; }
    input[type="password"] {
      width: 100%; box-sizing: border-box; padding: 13px 18px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.35);
      border-radius: 999px; color: #ffffff; font-size: 16px; text-align: center;
      outline: none; transition: border-color 240ms cubic-bezier(0.4,0,0.2,1);
    }
    input[type="password"]::placeholder { color: rgba(255,255,255,0.5); }
    input[type="password"]:focus { border-color: rgba(255,255,255,0.7); }
    button {
      padding: 13px 26px; background: #05164d; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.35); border-radius: 999px;
      color: #ffffff; font-size: 14px; font-weight: 400; width: 100%;
      transition: background-color 240ms cubic-bezier(0.4,0,0.2,1);
    }
    button:hover { background: #243f9b; }
    button:disabled { opacity: 0.6; cursor: default; }
    .err { min-height: 18px; font-size: 0.85rem; color: #ffd0d0; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">AI Engineering from Scratch</div>
    <div class="over">LHIND</div>
    <p class="msg">This is a private trial. Enter the access passcode to continue.</p>
    <form id="gate">
      <input type="password" id="passcode" placeholder="Passcode" autocomplete="current-password" autofocus required>
      <button type="submit" id="submit">Enter</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script>
    var form = document.getElementById('gate');
    var err = document.getElementById('err');
    var btn = document.getElementById('submit');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try {
        var res = await fetch('/api/gate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode: document.getElementById('passcode').value }),
        });
        if (res.ok) {
          var params = new URLSearchParams(location.search);
          location.assign(params.get('r') || '/');
          return;
        }
        err.textContent = 'Incorrect passcode.';
      } catch (_) {
        err.textContent = 'Something went wrong. Try again.';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
